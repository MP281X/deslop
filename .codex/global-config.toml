model_instructions_file = "instructions.md"

web_search = "live"
include_permissions_instructions = false
include_collaboration_mode_instructions = false
tool_output_token_limit = 25000
background_terminal_max_timeout = 1500000

[agents]
enabled = false

[skills.bundled]
enabled = false

[cloud.skills]
enabled = false

[tools.experimental_request_user_input]
enabled = false

[features]
# Stateless MCP: no initialize handshake or session per server.
mcp_2026_07_28 = true
skill_mcp_dependency_install = false
skill_search = false
tool_suggest = false
remote_plugin = false
plugin_sharing = false
sleep_tool = false
apps = false
plugins = false
goals = false

# Threads run without approval prompts, so an MCP tool that asks for approval is rejected.
[mcp_servers.dual]
url = "https://app.dualos.ai/mcp"
default_tools_approval_mode = "approve"

[mcp_servers.scope]
url = "https://dev.tailnet-8c4c.ts.net:4318/mcp"
default_tools_approval_mode = "approve"

[mcp_servers.stash]
url = "https://dev.tailnet-8c4c.ts.net:4319/mcp"
default_tools_approval_mode = "approve"

[mcp_servers.portfolio]
url = "https://dev.tailnet-8c4c.ts.net:4320/mcp"
default_tools_approval_mode = "approve"

[mcp_servers.mobbin]
url = "https://api.mobbin.com/mcp"
default_tools_approval_mode = "approve"

[[hooks.SessionStart]]
[[hooks.SessionStart.hooks]]
type = "command"
command = "printf 'Execution worker: %s\n' \"$(hostname -s)\""
timeout = 5

# Codex runs a user hook only when this hash of its event and handler matches; app-server `hooks/list` prints the current one.
[hooks.state."/home/mp281x/.codex/config.toml:session_start:0:0"]
trusted_hash = "sha256:e963292c7825ded13e242a454d027809ac0c8eb1cabdb193f215e9e095109f5a"

[shell_environment_policy]
set = { GLAB_PAGER = "cat", NO_COLOR = "1", TURBO_SCM_BASE = "origin/master" }

[projects."/home/mp281x/deslop"]
trust_level = "trusted"

[projects."/home/mp281x/dual"]
trust_level = "trusted"
