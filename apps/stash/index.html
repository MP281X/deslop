<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#000000" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<link rel="icon" href="/src/web/icon.svg" />
		<link rel="manifest" href="/manifest.webmanifest" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		<link rel="stylesheet" href="/src/web/startup.css" />
		<title>Stash</title>
	</head>
	<body>
		<div id="root"></div>
		<div class="stash-startup" role="status" aria-label="Loading Stash">
			<div class="stash-startup-queue" aria-hidden="true"></div>
			<div class="stash-startup-note" aria-hidden="true"></div>
		</div>
		<script>
			const stashSearch = new URLSearchParams(location.search)
			const stashPane = stashSearch.get('pane')
			document.documentElement.toggleAttribute(
				'data-stash-note',
				stashPane === 'detail' || (stashPane === null && stashSearch.has('note'))
			)
		</script>
		<script type="module" src="/src/web/main.ts"></script>
	</body>
</html>
