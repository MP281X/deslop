<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
		/>
		<meta name="theme-color" content="#000000" />
		<meta name="color-scheme" content="dark" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<link rel="icon" href="/src/web/icon.svg" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		<link rel="manifest" href="/manifest.webmanifest" />

		<link rel="preload" href="/api/account" as="fetch" crossorigin />
		<link rel="stylesheet" href="/src/web/skeleton.css" />
		<title>Deploy</title>
	</head>
	<body style="margin: 0; background: #000; color: #f4f4f4">
		<div id="root" style="height: 100dvh"></div>
		<div class="deploy-startup" aria-label="Loading Deploy" role="status">
			<div class="deploy-initial-list" aria-hidden="true"></div>
			<div class="deploy-initial-detail" aria-hidden="true"></div>
		</div>
		<script>
			const query = new URLSearchParams(location.search)
			document
				.querySelector('.deploy-startup')
				.toggleAttribute('data-detail', query.has('app') && query.get('pane') !== 'apps')
		</script>
		<script type="module" src="/src/web/main.ts"></script>
	</body>
</html>
