<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
		/>
		<meta name="color-scheme" content="dark" />
		<meta name="theme-color" content="#000000" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<link rel="manifest" href="/manifest.webmanifest" />
		<link rel="icon" href="/src/web/icon.svg" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		<link rel="stylesheet" href="/src/web/skeleton.css" />
		<title>Trips</title>
	</head>
	<body>
		<div id="root"></div>
		<div class="trips-startup" aria-label="Loading Trips" role="status" aria-busy="true">
			<div class="trips-skeleton-list" aria-hidden="true"></div>
			<div class="trips-skeleton-board" aria-hidden="true"></div>
		</div>
		<script>
			const pane = new URLSearchParams(location.search).get('pane')
			document
				.querySelector('.trips-startup')
				.toggleAttribute(
					'data-detail',
					pane === 'detail' || (pane !== 'list' && /^\/(day|flight)\//.test(location.pathname))
				)
		</script>
		<script type="module" src="/src/web/main.ts"></script>
	</body>
</html>
