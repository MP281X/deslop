<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
		/>
		<meta name="theme-color" content="#000000" />
		<meta name="color-scheme" content="dark" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<link rel="icon" href="/src/web/icon.svg" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		<link rel="manifest" href="/manifest.webmanifest" />

		<link rel="stylesheet" href="/src/web/skeleton.css" />
		<title>Scope</title>
	</head>
	<body style="margin: 0; background: #000; color: #f4f4f4">
		<div id="root" style="height: 100dvh"></div>
		<div class="scope-startup" aria-label="Loading Scope" role="status" aria-busy="true">
			<div class="scope-start-list"></div>
			<div class="scope-start-trace"></div>
		</div>
		<script>
			const search = new URLSearchParams(location.search)
			document.querySelector('.scope-startup').toggleAttribute(
				'data-detail',
				['pane', 'operation', 'trace', 'span'].some(key => search.has(key))
			)
		</script>
		<script type="module" src="/src/web/main.ts"></script>
	</body>
</html>
