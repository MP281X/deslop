<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="color-scheme" content="dark" />
		<meta name="theme-color" content="#000000" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<link rel="icon" href="/src/web/icon.svg" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		<link rel="manifest" href="/manifest.webmanifest" />

		<link rel="stylesheet" href="/src/web/skeleton.css" />
		<title>Scope</title>
	</head>
	<body>
		<div id="root"></div>
		<div class="scope-startup" aria-label="Loading Scope" role="status" aria-busy="true">
			<div class="scope-skeleton-list" aria-hidden="true"></div>
			<div class="scope-skeleton-trace" aria-hidden="true"></div>
		</div>
		<script>
			const search = new URLSearchParams(location.search)
			const startup = document.querySelector('.scope-startup')
			startup.toggleAttribute('data-native', location.protocol === 'capacitor:')
			startup.toggleAttribute(
				'data-detail',
				search.has('pane') || search.has('operation') || search.has('trace') || search.has('span')
			)
		</script>
		<script type="module" src="/src/web/main.ts"></script>
	</body>
</html>
