<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
		/>
		<meta name="color-scheme" content="light dark" />
		<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#0d0c0c" media="(prefers-color-scheme: dark)" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<link rel="icon" href="/src/routes/icon.svg" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		<link rel="manifest" href="/manifest.webmanifest" />
		<!-- Requested with the profile, so presence never waits a round trip for it; the printable CV reads none. -->
		<script>
			if (location.pathname !== '/cv') {
				document.head.append(
					Object.assign(document.createElement('link'), {
						as: 'fetch',
						crossOrigin: 'anonymous',
						href: '/api/runtime',
						rel: 'preload'
					})
				)
			}
		</script>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/main.client.tsx"></script>
	</body>
</html>
