<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
		/>
		<meta name="theme-color" content="#000000" />
		<meta name="color-scheme" content="dark" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<link rel="icon" href="/src/web/icon.svg" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		<link rel="manifest" href="/manifest.webmanifest" />

		<link rel="stylesheet" href="/src/web/startup.css" />
		<title>Auth</title>
	</head>
	<body style="margin: 0; background: #000; color: #f4f4f4">
		<div id="root" style="height: 100dvh"></div>
		<div class="auth-startup" aria-label="Loading Auth" role="status" aria-busy="true">
			<div class="auth-skeleton-list" aria-hidden="true"></div>
			<div class="auth-skeleton-detail" aria-hidden="true"><div class="auth-skeleton-list"></div></div>
		</div>
		<script>
			const search = new URLSearchParams(location.search)
			const startup = document.querySelector('.auth-startup')
			startup.toggleAttribute(
				'data-detail',
				search.get('pane') === 'detail' || (!search.has('pane') && search.has('person'))
			)
			startup.toggleAttribute('data-person', search.has('person'))
		</script>
		<script type="module" src="/src/web/main.ts"></script>
	</body>
</html>
