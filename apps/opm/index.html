<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="theme-color" content="#000000" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<link rel="manifest" href="/manifest.webmanifest" />
		<link rel="icon" href="/src/web/icon.svg" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		<link rel="stylesheet" href="/src/web/skeleton.css" />
		<title>OPM</title>
	</head>
	<body>
		<div id="root"></div>
		<div class="opm-startup" aria-label="Loading chapters" role="status" aria-busy="true">
			<div class="opm-skeleton-list" aria-hidden="true"></div>
			<div class="opm-page-placeholder" aria-hidden="true"></div>
		</div>
		<script>
			const search = new URLSearchParams(location.search)
			const startup = document.querySelector('.opm-startup')
			startup.toggleAttribute('data-detail', search.has('chapter'))
		</script>
		<script type="module" src="/src/web/main.ts"></script>
	</body>
</html>
