[skills.bundled]
enabled = false

[features]
apps = false
plugins = false
image_generation = false
goals = false
default_mode_request_user_input = true

[features.multi_agent_v2]
multi_agent_mode_hint_text = "Spawn the explorer, worker, and review roles whenever your developer instructions call for them."
default_wait_timeout_ms = 1500000

[shell_environment_policy]
set = { TURBO_CACHE_DIR = "/home/mp281x/.cache/turbo", GLAB_PAGER = "cat" }

[projects."/home/mp281x"]
trust_level = "trusted"

[agents.explorer]
description = "Answers a bounded question, or a chain whose answers feed each other, from code, library source, logs, past threads, the host, or the web, with path:line facts. Brief: the question, starting paths and known evidence, the decision it settles, and when to stop; for a count, what counts as a member. One agent per independent question; reuse one for its follow-ups."
config_file = "./agents/explorer.toml"

[agents.worker]
description = "Runs one fully specified task that needs no taste: checks and suites, pipeline watches and triage, experiments and variants, browser proofs, mechanical edits, or replicating an instance you wrote. Brief: the goal, the exact commands or edit, the base branch, and what it may change; for a browser task the URL, state file, credentials, and one criterion per line as input → checkable result; for an experiment the hypothesis and the observation that decides; for a replication the reference instance and the files the target owns."
config_file = "./agents/worker.toml"

[agents.review]
description = "Refutes a design before implementation and reviews the finished diff. Brief: for a design, the user's quoted constraints, the directions tried with their evidence, the pick, and the tracer bullet; for a diff, the Done-when list, launched beside the full check."
config_file = "./agents/review.toml"
