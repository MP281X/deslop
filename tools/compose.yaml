name: deslop

x-service: &service
  restart: unless-stopped
  networks: [deslop]
  logging: {driver: local, options: {max-file: '3', max-size: 10m}}

# Servers export to Scope, and the signed-in ones check each sign-in with the auth app, inside this network, skipping the public TLS round trip.
x-environment: &environment {VITE_OTEL_URL: http://scope:4318}
x-signed: &signed {AUTH_URL: http://auth:5000, VITE_OTEL_URL: http://scope:4318}

services:
  traefik:
    <<: *service
    image: traefik:latest
    command:
      - --accesslog=true
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.websecure.address=:443
      - --entrypoints.websecure.http3
      - --entrypoints.websecure.http.tls.certresolver=letsencrypt
      - --entrypoints.websecure.http.middlewares=compress@file
      # The default 60-second read timeout cuts off a video the share extension uploads over a slow network.
      - --entrypoints.websecure.transport.respondingTimeouts.readTimeout=1h
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
      # The default RSA4096 costs 3.5 ms of signing per handshake; EC256 under 0.1 ms.
      - --certificatesresolvers.letsencrypt.acme.keytype=EC256
      - --certificatesresolvers.letsencrypt.acme.storage=/acme/acme.json
      - --providers.docker.exposedbydefault=false
      - --providers.file.filename=/etc/traefik/dynamic.yaml
    ports: ['0.0.0.0:80:80', '[::]:80:80', '0.0.0.0:443:443', '[::]:443:443', '0.0.0.0:443:443/udp', '[::]:443:443/udp']
    configs: [{source: traefik, target: /etc/traefik/dynamic.yaml}]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${HOME}/.deslop/deploy/acme:/acme

  portfolio:
    <<: *service
    image: ghcr.io/mp281x/deslop-portfolio:${REVISION:-latest}
    environment: *environment
    ports: [127.0.0.1:4320:5000]
    labels:
      traefik.enable: 'true'
      traefik.http.routers.portfolio.rule: Host(`portfolio.mp281x.xyz`)
      traefik.http.services.portfolio.loadbalancer.server.port: '5000'

  auth:
    <<: *service
    image: ghcr.io/mp281x/deslop-auth:${REVISION:-latest}
    env_file: ${HOME}/.deslop/auth.env
    environment: *environment
    volumes: ['${HOME}/.deslop/auth:/home/node/.deslop/auth']
    labels:
      traefik.enable: 'true'
      traefik.http.routers.auth.rule: Host(`auth.mp281x.xyz`)
      traefik.http.services.auth.loadbalancer.server.port: '5000'

  gateway:
    <<: *service
    image: ghcr.io/mp281x/deslop-gateway:${REVISION:-latest}
    # GITHUB_ADMINS, as Auth has it: Auth's admins manage the servers.
    env_file: ${HOME}/.deslop/gateway.env
    environment: *signed
    # The second volume holds the servers the previous release kept in Auth, which the gateway moves into its own once.
    volumes:
      ['${HOME}/.deslop/gateway:/home/node/.deslop/gateway', '${HOME}/.deslop/auth/mcp:/home/node/.deslop/auth/mcp']
    labels:
      traefik.enable: 'true'
      traefik.http.routers.gateway.rule: Host(`gateway.mp281x.xyz`)
      traefik.http.services.gateway.loadbalancer.server.port: '5000'

  stash:
    <<: *service
    image: ghcr.io/mp281x/deslop-stash:${REVISION:-latest}
    env_file: ${HOME}/.deslop/stash.env
    environment: *signed
    volumes: ['${HOME}/.deslop/stash:/home/node/.deslop/stash']
    ports: [127.0.0.1:4319:5000]
    labels:
      traefik.enable: 'true'
      traefik.http.routers.stash.rule: Host(`stash.mp281x.xyz`)
      traefik.http.services.stash.loadbalancer.server.port: '5000'

  opm:
    <<: *service
    image: ghcr.io/mp281x/deslop-opm:${REVISION:-latest}
    env_file: ${HOME}/.deslop/opm.env
    environment: *signed
    volumes: ['${HOME}/.deslop/opm:/home/node/.deslop/opm']
    labels:
      traefik.enable: 'true'
      traefik.http.routers.opm.rule: Host(`opm.mp281x.xyz`)
      traefik.http.services.opm.loadbalancer.server.port: '5000'

  trips:
    <<: *service
    image: ghcr.io/mp281x/deslop-trips:${REVISION:-latest}
    env_file: ${HOME}/.deslop/trips.env
    environment: *signed
    volumes: ['${HOME}/.deslop/trips:/home/node/.deslop/trips']
    labels:
      traefik.enable: 'true'
      traefik.http.routers.trips.rule: Host(`trips.mp281x.xyz`)
      traefik.http.services.trips.loadbalancer.server.port: '5000'

  signal:
    <<: *service
    scale: 0
    image: ghcr.io/mp281x/deslop-signal:${REVISION:-latest}
    env_file: ${HOME}/.deslop/signal.env
    environment: *signed
    volumes: ['${HOME}/.deslop/signal:/home/node/.deslop/signal']
    labels:
      traefik.enable: 'true'
      traefik.http.routers.signal.rule: Host(`signal.mp281x.xyz`)
      traefik.http.services.signal.loadbalancer.server.port: '5000'

  scope:
    <<: *service
    image: ghcr.io/mp281x/deslop-scope:${REVISION:-latest}
    # Scope receives telemetry itself, so it exports none.
    environment: {AUTH_URL: http://auth:5000, HOST: 0.0.0.0}
    volumes: ['${HOME}/.deslop/scope:/home/node/.deslop/scope']
    ports: [127.0.0.1:4318:4318]
    labels:
      traefik.enable: 'true'
      traefik.http.routers.scope.rule: Host(`scope.mp281x.xyz`)
      traefik.http.routers.otlp.rule: Host(`otel.mp281x.xyz`) && (Path(`/v1/traces`) || Path(`/v1/logs`))
      traefik.http.services.otlp.loadbalancer.server.port: '5000'

  # Every minute it applies main's commit with the app images tagged by that commit; until a release has pushed all of them, the pull fails and nothing changes.
  # It reads main's commit from Git's ref listing, which has no API rate limit. A change to this entry needs one manual `up -d`.
  deploy:
    <<: *service
    image: docker:cli
    environment: {HOME: '${HOME}'}
    working_dir: ${HOME}/.deslop/deploy
    volumes: ['/var/run/docker.sock:/var/run/docker.sock', '${HOME}/.deslop:${HOME}/.deslop']
    command:
      - sh
      - -c
      - |
        while true; do
          export REVISION=$$(wget -qO- 'https://github.com/MP281X/deslop.git/info/refs?service=git-upload-pack' | tr -d '\000' | grep -o '[0-9a-f]\{40\} refs/heads/main' | cut -c1-40)
          [ -n "$$REVISION" ] &&
            wget -qO compose.yaml "https://raw.githubusercontent.com/MP281X/deslop/$$REVISION/tools/compose.yaml" &&
            docker compose --project-name deslop --file compose.yaml pull --quiet &&
            docker compose --project-name deslop --file compose.yaml up --detach --remove-orphans $$(docker compose --file compose.yaml config --services | grep -vx deploy)
          sleep 60
        done

configs:
  traefik:
    # Only whole documents: a compressor buffers its first kilobyte, which would hold back MCP's event streams.
    content: |
      http:
        middlewares:
          compress:
            compress:
              includedContentTypes: [text/html, text/css, text/javascript, application/json, image/svg+xml]

networks:
  deslop:
    name: deslop
