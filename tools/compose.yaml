name: deslop

x-service: &service
  restart: unless-stopped
  networks: [deslop]
  logging: {driver: local, options: {max-file: '3', max-size: 10m}}

services:
  traefik:
    <<: *service
    image: traefik:latest
    command:
      - --accesslog=true
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.websecure.address=:443
      - --entrypoints.websecure.http.tls.certresolver=letsencrypt
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
      - --certificatesresolvers.letsencrypt.acme.storage=/acme/acme.json
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=deslop
      - --providers.file.filename=/etc/traefik/previews.yaml
    ports: [80:80, 443:443]
    extra_hosts: [host.docker.internal:host-gateway]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /home/mp281x/.deslop/deploy/acme:/acme
    configs: [{source: previews, target: /etc/traefik/previews.yaml}]

  portfolio:
    <<: *service
    image: ghcr.io/mp281x/deslop-portfolio:latest
    environment: {VITE_OTEL_URL: http://collector:4318}
    labels:
      traefik.enable: 'true'
      traefik.http.routers.portfolio.rule: Host(`portfolio.mp281x.xyz`)
      traefik.http.services.portfolio.loadbalancer.server.port: '5000'

  jaeger:
    <<: *service
    image: jaegertracing/all-in-one:latest
    ports: [127.0.0.1:16686:16686]

  collector:
    <<: *service
    image: otel/opentelemetry-collector-contrib:latest
    command: [--config=/etc/otelcol-contrib/config.yaml]
    configs: [{source: collector, target: /etc/otelcol-contrib/config.yaml}]
    ports: [127.0.0.1:4318:4318]
    labels:
      traefik.enable: 'true'
      traefik.http.routers.otlp.rule: Host(`otel.mp281x.xyz`)
      traefik.http.services.otlp.loadbalancer.server.port: '4318'

configs:
  previews:
    content: |
      http:
        routers:
      {{- range until 10 }}
          '{{ add 4000 . }}': {rule: Host(`{{ add 4000 . }}.mp281x.xyz`), service: '{{ add 4000 . }}'}
      {{- end }}
        services:
      {{- range until 10 }}
          '{{ add 4000 . }}': {loadBalancer: {servers: [{url: 'http://host.docker.internal:{{ add 4000 . }}'}]}}
      {{- end }}

  collector:
    content: |
      receivers:
        otlp:
          protocols:
            http:
              endpoint: 0.0.0.0:4318
              cors: {allowed_origins: [https://portfolio.mp281x.xyz]}
      processors:
        memory_limiter: {check_interval: 1s, limit_mib: 256}
        batch: {}
      exporters:
        debug: {verbosity: basic}
        otlp/jaeger: {endpoint: jaeger:4317, tls: {insecure: true}}
      service:
        pipelines:
          logs: {receivers: [otlp], processors: [memory_limiter, batch], exporters: [debug]}
          traces: {receivers: [otlp], processors: [memory_limiter, batch], exporters: [otlp/jaeger]}

networks:
  deslop:
    name: deslop
