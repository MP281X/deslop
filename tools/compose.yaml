name: deslop

x-service: &service
  restart: unless-stopped
  networks: [deslop]
  logging: {driver: local, options: {max-file: '3', max-size: 10m}}

services:
  traefik:
    <<: *service
    image: traefik:latest
    command:
      - --accesslog=true
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.websecure.address=:443
      - --entrypoints.websecure.http.tls.certresolver=letsencrypt
      # The default 60-second read timeout cuts off a video the share extension uploads over a slow network.
      - --entrypoints.websecure.transport.respondingTimeouts.readTimeout=1h
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
      - --certificatesresolvers.letsencrypt.acme.storage=/acme/acme.json
      - --providers.docker.exposedbydefault=false
    ports: ['0.0.0.0:80:80', '[::]:80:80', '0.0.0.0:443:443', '[::]:443:443']
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${HOME}/.deslop/deploy/acme:/acme

  portfolio:
    <<: *service
    image: ghcr.io/mp281x/deslop-portfolio:latest
    environment: {VITE_OTEL_URL: http://scope:5000}
    labels:
      traefik.enable: 'true'
      traefik.http.routers.portfolio.rule: Host(`portfolio.mp281x.xyz`)
      traefik.http.services.portfolio.loadbalancer.server.port: '5000'

  auth-server:
    <<: *service
    image: ghcr.io/mp281x/deslop-auth-server:latest
    env_file: ${HOME}/.deslop/auth-server.env
    environment: {VITE_OTEL_URL: http://scope:5000}
    labels:
      traefik.enable: 'true'
      traefik.http.routers.auth-server.rule: Host(`auth.mp281x.xyz`)
      traefik.http.services.auth-server.loadbalancer.server.port: '5000'

  stash:
    <<: *service
    image: ghcr.io/mp281x/deslop-stash:latest
    env_file: ${HOME}/.deslop/stash.env
    environment: {VITE_OTEL_URL: http://scope:5000}
    volumes: ['${HOME}/.deslop/stash:/home/node/.deslop/stash', '${HOME}/.cache/deslop:/home/node/.cache/deslop']
    labels:
      traefik.enable: 'true'
      traefik.http.routers.stash.rule: Host(`stash.mp281x.xyz`)
      traefik.http.services.stash.loadbalancer.server.port: '5000'

  scope:
    <<: *service
    image: ghcr.io/mp281x/deslop-scope:latest
    environment: {HOST: 0.0.0.0}
    volumes: ['${HOME}/.deslop/scope:/home/node/.deslop/scope']
    ports: [127.0.0.1:4318:5000]
    labels:
      traefik.enable: 'true'
      traefik.http.routers.otlp.rule: Host(`otel.mp281x.xyz`) && (Path(`/v1/traces`) || Path(`/v1/logs`))
      traefik.http.services.otlp.loadbalancer.server.port: '5000'
      traefik.http.routers.scope.rule: Host(`scope.mp281x.xyz`)
      traefik.http.routers.scope.service: otlp

networks:
  deslop:
    name: deslop
