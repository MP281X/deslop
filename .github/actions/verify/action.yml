name: Verify
description: Format, lint, types, dead code and the repository checks; every package built and every built server probed; every test. Needs the setup action with its task cache.

runs:
  using: composite
  steps:
    - name: Format, lint, types, dead code and repository checks
      shell: bash
      run: vp run check
    - name: Build applications
      shell: bash
      run: vp run build
    # Each built server answers its authorization probe before anything ships.
    - name: Probe built server authorization
      shell: bash
      run: |
        for entry in apps/*/src/main.server.ts; do
          node "${entry%/src/main.server.ts}/dist/server.js" probe
        done
    - name: Tests
      shell: bash
      run: vp run test
