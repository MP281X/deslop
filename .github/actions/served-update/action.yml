name: Served update
description: The commit of the newest update on the branch the production channel serves, and whether it is newer than the checkout, which needs its full history.

inputs:
  app:
    description: The app's directory name under `apps`.
    required: true
  expo-token:
    description: The Expo token, secret `EXPO_TOKEN`; reading a channel needs a login.
    required: true

outputs:
  commit:
    description: The served update's commit, empty before the first update.
    value: ${{ steps.served.outputs.commit }}
  superseded:
    description: '`true` when a newer commit already serves its update, so this run must not ship over it.'
    value: ${{ steps.served.outputs.superseded }}

runs:
  using: composite
  steps:
    # Phones read the channel, which can point at a branch of another name; a rollout serves two branches at once, so it has to finish first.
    - name: Find the served update
      id: served
      shell: bash
      working-directory: apps/${{ inputs.app }}
      env:
        EXPO_TOKEN: ${{ inputs.expo-token }}
      run: |
        commit=$(eas channel:view production --json --non-interactive | jq -r '
          .currentPage as $channel
          | ($channel.branchMapping | fromjson | .data) as $mapping
          | if ($mapping | length) != 1 or $mapping[0].branchMappingLogic != "true"
            then error("The production channel does not serve exactly one branch; finish its rollout with eas channel:rollout")
            else $mapping[0].branchId end
          | . as $branch
          | [$channel.updateBranches[] | select(.id == $branch) | .updateGroups[0][0].gitCommitHash // empty] | first // empty')
        superseded=false
        if [[ -n $commit && $commit != "$GITHUB_SHA" ]] && git cat-file -e "$commit^{commit}" 2> /dev/null && git merge-base --is-ancestor HEAD "$commit"; then
          superseded=true
          echo "- $(basename "$PWD"): production already serves the newer $commit; nothing ships" >> "$GITHUB_STEP_SUMMARY"
        fi
        echo "commit=$commit" >> "$GITHUB_OUTPUT"
        echo "superseded=$superseded" >> "$GITHUB_OUTPUT"
