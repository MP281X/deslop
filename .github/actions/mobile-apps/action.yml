name: Mobile apps
description: The iPhone apps, as a JSON array of their folder names under `apps`.

outputs:
  apps:
    description: The names of the folders under `apps` that hold an `app.config.ts`.
    value: ${{ steps.apps.outputs.apps }}

runs:
  using: composite
  steps:
    - name: Discover the apps
      id: apps
      shell: bash
      run: echo "apps=$(ls apps/*/app.config.ts | cut -d/ -f2 | jq -Rsc 'split("\n") | map(select(length > 0))')" >> "$GITHUB_OUTPUT"
