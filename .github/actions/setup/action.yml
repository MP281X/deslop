name: Set up
description: Node, Vite+, the workspace's dependencies and the EAS CLI; on a Mac, what a local iOS build downloads.

runs:
  using: composite
  steps:
    # No pnpm store cache: downloading the packages beats restoring the store, 15s against 31s on Linux and 35s against 80s on the Mac.
    - uses: voidzero-dev/setup-vp@v1.22.0
      with:
        node-version: '26'
        run-install: true

    # With pnpm from home, outside the workspace, whose strict peer checks would reject the EAS CLI's dependencies; PNPM_HOME stays in this step, so the workspace's store is untouched.
    # On a Mac, a local build otherwise fetches its plugin with npx on every build, about 25s, and through git copies every tracked file twice; EAS_NO_VCS copies the working tree alone.
    - name: Install the EAS CLI
      shell: bash
      run: |
        export PNPM_HOME="$RUNNER_TEMP/pnpm"
        export PATH="$PNPM_HOME/bin:$PATH"
        cd ~
        cli=$(pnpm view eas-cli version)
        packages=("eas-cli@$cli")
        if [[ $RUNNER_OS == macOS ]]; then
          packages+=("eas-cli-local-build-plugin@$(pnpm view "eas-cli@$cli" 'dependencies.@expo/eas-build-job')")
          echo "EAS_LOCAL_BUILD_PLUGIN_PATH=$PNPM_HOME/bin/eas-cli-local-build-plugin" >> "$GITHUB_ENV"
          echo "EAS_NO_VCS=1" >> "$GITHUB_ENV"
        fi
        pnpm add --global --allow-build=node-pty "${packages[@]}"
        echo "$PNPM_HOME/bin" >> "$GITHUB_PATH"

    # CocoaPods and the Hermes tarball download with curl to files, so stalled transfers retry; after setup-vp, whose installer streams into bash where a retry would append a second script.
    - name: Retry stalled downloads
      if: runner.os == 'macOS'
      shell: bash
      run: printf '%s\n' 'retry = 5' 'retry-all-errors' 'connect-timeout = 15' 'speed-limit = 10000' 'speed-time = 30' > ~/.curlrc

    # One cache for every app, as their pods come from the same lockfile. Only main saves it: a copy per branch, about 420 MB each, filled the repository's 10 GB.
    - name: Restore and save the CocoaPods cache
      if: runner.os == 'macOS' && github.ref == 'refs/heads/main'
      uses: actions/cache@v6
      with:
        path: |
          ~/Library/Caches/CocoaPods
          ~/Library/Caches/ReactNative
        key: pods-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: pods-
    - name: Restore the CocoaPods cache
      if: runner.os == 'macOS' && github.ref != 'refs/heads/main'
      uses: actions/cache/restore@v6
      with:
        path: |
          ~/Library/Caches/CocoaPods
          ~/Library/Caches/ReactNative
        key: pods-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: pods-
