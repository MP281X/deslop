name: Set up
description: Node, Vite+ and the workspace's dependencies; on request the job's last task cache, the EAS CLI and an iOS build's downloads.

inputs:
  tasks:
    description: Restore and save the Vite+ task cache, for jobs that run `vp run`.
    default: 'false'
  eas:
    description: Install the EAS CLI as `eas`.
    default: 'false'
  ios:
    description: Prepare a local iOS build.
    default: 'false'

runs:
  using: composite
  steps:
    - name: Install Node, Vite+ and dependencies
      uses: voidzero-dev/setup-vp@v1.21.2
      with: {node-version: '26', cache: true, run-install: true}

    # After the install, which recreates node_modules. Each job restores its own newest results and saves the next once it succeeds; entries are immutable, so the key rolls with each run.
    - name: Restore the task cache
      if: inputs.tasks == 'true'
      uses: actions/cache@v6
      with:
        path: node_modules/.vite/task-cache
        key: vite-task-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: vite-task-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-

    # With npm, because pnpm applies the workspace's strict peer checks to the EAS CLI's own dependencies.
    - name: Install the EAS CLI
      if: inputs.eas == 'true'
      shell: bash
      run: npm install --global --silent eas-cli@latest

    # CocoaPods and the Hermes tarball download with curl to files: a reset or a stalled transfer retries instead of failing the build or hanging for minutes. After setup-vp, whose installer streams into bash, where a retry would append a second script.
    - name: Retry stalled downloads
      if: inputs.ios == 'true'
      shell: bash
      run: printf '%s\n' 'retry = 5' 'retry-all-errors' 'connect-timeout = 15' 'speed-limit = 10000' 'speed-time = 30' > ~/.curlrc

    # One cache for every app: their pods come from the same lockfile, and the Hermes tarball's mirror often stalls.
    - name: Restore the CocoaPods cache
      if: inputs.ios == 'true'
      uses: actions/cache@v6
      with:
        path: |
          ~/Library/Caches/CocoaPods
          ~/Library/Caches/ReactNative
        key: pods-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: pods-
