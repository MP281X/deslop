name: Await verification
description: Wait until this run's Verify jobs have succeeded.

runs:
  using: composite
  steps:
    - uses: actions/github-script@v9
      with:
        github-token: ${{ github.token }}
        script: |
          const deadline = Date.now() + 15 * 60 * 1000
          for (;;) {
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
              per_page: 100
            })
            const verify = jobs.filter(job => job.name.startsWith('Verify /'))
            const failed = verify.find(job => job.conclusion && !['success', 'skipped', 'neutral'].includes(job.conclusion))
            if (failed) {
              core.setFailed(`${failed.name}: ${failed.conclusion}`)
              return
            }
            if (verify.length > 0 && verify.every(job => job.status === 'completed')) {
              core.info('Verify passed.')
              return
            }
            if (Date.now() > deadline) {
              core.setFailed('Verify did not finish within 15 minutes.')
              return
            }
            await new Promise(resolve => setTimeout(resolve, 10_000))
          }
