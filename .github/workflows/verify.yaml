name: Verify

# Every pull request, on GitHub's merge with its base rather than the branch alone; Release runs the same steps on what it ships.
on:
  pull_request:

# For a pull request the ref is its merge ref, so a new push replaces only that pull request's older run.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # One job, one setup: the steps share the install and the task cache.
  verify:
    name: Verify
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with: {tasks: 'true'}
      - uses: ./.github/actions/verify
