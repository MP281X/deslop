name: Verify

# Every branch push, and Release on the merged commit: a branch behind main can merge without conflicts and still break.
on:
  push:
    branches-ignore: [main]
  workflow_call:
    outputs:
      mobile:
        value: ${{ jobs.check.outputs.mobile }}

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build
    # Release already builds after verification, immediately before publishing.
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with: {tasks: 'true'}
      - name: Build applications
        run: vp run build

  check:
    name: Check
    runs-on: ubuntu-26.04
    outputs:
      mobile: ${{ steps.apps.outputs.mobile }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with: {tasks: 'true'}
      - name: Discover mobile apps
        id: apps
        run: |
          shopt -s nullglob
          apps=(apps/*/app.config.ts)
          apps=("${apps[@]%/app.config.ts}")
          apps=("${apps[@]#apps/}")
          echo "mobile=$(printf '%s\n' "${apps[@]}" | jq -Rsc 'split("\n") | map(select(length > 0))')" >> "$GITHUB_OUTPUT"
      - name: Format, lint, types and dead code
        run: vp run check

  test:
    name: Test
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with: {tasks: 'true'}
      - name: Tests
        run: vp run test
