name: Verify

# Every branch push; Release repeats this unless the merged tree already passed.
on:
  push:
    branches-ignore: [main]
  workflow_call:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build
    # Release already builds after verification, immediately before publishing.
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with: {tasks: 'true'}
      - name: Build applications
        run: vp run build

  check:
    name: Check
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with: {tasks: 'true'}
      - name: Format, lint, types and dead code
        run: vp run check

  test:
    name: Test
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with: {tasks: 'true'}
      - name: Tests
        run: vp run test
