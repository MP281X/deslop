name: Verify

# Every branch push, and Release on the merged commit: a branch behind main can merge without conflicts and still break.
on:
  push:
    branches-ignore: [main]
  workflow_call:
    outputs:
      mobile:
        value: ${{ jobs.verify.outputs.mobile }}

# A newer push to the same branch replaces the older run.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Branch pushes check bundling as well as source and tests.
jobs:
  verify:
    name: Check and test
    runs-on: ubuntu-26.04
    outputs:
      mobile: ${{ steps.apps.outputs.mobile }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with: {tasks: 'true'}
      - name: Discover mobile apps
        id: apps
        run: |
          shopt -s nullglob
          apps=(apps/*/app.config.ts)
          apps=("${apps[@]%/app.config.ts}")
          apps=("${apps[@]#apps/}")
          echo "mobile=$(printf '%s\n' "${apps[@]}" | jq -Rsc 'split("\n") | map(select(length > 0))')" >> "$GITHUB_OUTPUT"
      - name: Format, lint, types and dead code
        run: vp run check
      - name: Tests
        run: vp run test
      # Branch pushes check bundling; Release builds after verification, immediately before publishing.
      - name: Build applications
        if: github.ref != 'refs/heads/main'
        run: vp run build
