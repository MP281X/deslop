name: App Store build

# The Simulator build needs no provisioning profile, so only a signed App Store build proves a native config change ships.
on:
  push:
    branches-ignore: [main]
    paths:
      - apps/*/app.config.ts
      - apps/*/eas.json
      - apps/*/targets/*/expo-target.config.js
      - .github/workflows/app-store-build.yaml

permissions:
  contents: read

# bash -eo pipefail: a failed command inside a pipeline or an assignment fails its step.
defaults:
  run:
    shell: bash

jobs:
  apps:
    name: Discover apps
    runs-on: ubuntu-26.04
    outputs:
      mobile: ${{ steps.apps.outputs.mobile }}
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 2}
      - name: Discover changed native config
        id: apps
        env:
          BASE: ${{ github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          if [[ $BASE =~ ^0+$ ]]; then
            BASE=$(gh api "repos/$GITHUB_REPOSITORY/compare/$DEFAULT_BRANCH...$GITHUB_SHA" --jq .merge_base_commit.sha)
          fi
          git cat-file -e "$BASE^{commit}" 2>/dev/null || git fetch --no-tags --depth=1 origin "$BASE"
          workflow=$(git diff --quiet "$BASE" HEAD -- .github/workflows/app-store-build.yaml && echo false || echo true)
          apps=()
          for config in apps/*/app.config.ts; do
            app=${config%/app.config.ts}
            # Diff names, not globs, so a deleted target config still counts.
            if [[ $workflow == true ]] || grep -qE '^apps/[^/]+/(app\.config\.ts|eas\.json|targets/[^/]+/expo-target\.config\.js)$' <<< "$(git diff --name-only "$BASE" HEAD -- "$app")"; then apps+=("${app#apps/}"); fi
          done
          mobile=$(printf '%s\n' "${apps[@]}" | jq -Rsc 'split("\n") | map(select(length > 0))')
          echo "mobile=$mobile" >> "$GITHUB_OUTPUT"

  app:
    name: App Store
    needs: apps
    if: needs.apps.outputs.mobile != '[]'
    concurrency:
      group: app-store-build-${{ github.ref }}-${{ matrix.app }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.apps.outputs.mobile) }}
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      APP_VARIANT: production
      DESLOP_DOMAIN: ${{ vars.DESLOP_DOMAIN }}
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EAS_BUILD_DISABLE_EXPO_DOCTOR_STEP: 1
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with: {eas: 'true', ios: 'true'}
      # The same signed build Release uploads, with the same provisioning profiles; nothing is uploaded.
      - name: Build the signed App Store app
        run: eas build --local --profile production --platform ios --non-interactive --output "$RUNNER_TEMP/app.ipa"
