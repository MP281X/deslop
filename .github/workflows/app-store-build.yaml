name: App Store build

# The Simulator build needs no provisioning profile, so only a signed App Store build proves a native change ships.
on:
  push:
    branches-ignore: [main]
    paths:
      - apps/*/app.config.ts
      - apps/*/eas.json
      - apps/*/targets/*/expo-target.config.js
      - '**.swift'
      - '**.plist'
      - '**.entitlements'
      - '**.podspec'
      - '**/expo-module.config.json'
      - packages/runtime/src/config/expo.ts
      - .github/workflows/app-store-build.yaml

permissions:
  contents: read

# bash -eo pipefail: a failed command inside a pipeline or an assignment fails its step.
defaults:
  run:
    shell: bash

jobs:
  apps:
    name: Discover apps
    runs-on: ubuntu-26.04
    outputs:
      mobile: ${{ steps.apps.outputs.mobile }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {fetch-depth: 2}
      - name: Discover mobile apps
        id: mobile
        uses: ./.github/actions/mobile-apps
      - name: Discover changed native inputs
        id: apps
        env:
          BASE: ${{ github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
          MOBILE: ${{ steps.mobile.outputs.apps }}
        run: |
          if [[ $BASE =~ ^0+$ ]]; then
            BASE=$(gh api "repos/$GITHUB_REPOSITORY/compare/$DEFAULT_BRANCH...$GITHUB_SHA" --jq .merge_base_commit.sha)
          fi
          git cat-file -e "$BASE^{commit}" 2>/dev/null || git fetch --no-tags --depth=1 origin "$BASE"
          # Diff names, not globs, both names of a rename, and each name whole, so a deleted, renamed, non-ASCII or multi-line input still counts as itself; the same inputs as the trigger's paths.
          native='\.(swift|plist|entitlements|podspec)$|(^|/)expo-module\.config\.json$|^apps/[^/]+/(app\.config\.ts|eas\.json|targets/[^/]+/expo-target\.config\.js)$|^packages/runtime/src/config/expo\.ts$|^\.github/workflows/app-store-build\.yaml$'
          # Every app builds from the shared config, components and this workflow, so a change outside apps/ proves them all.
          shared=0
          touched=()
          # Written to files first: a diff or a list that fails stops this step instead of selecting no app.
          git diff --name-only --no-renames -z "$BASE" HEAD > "$RUNNER_TEMP/changed"
          jq -r '.[]' <<< "$MOBILE" > "$RUNNER_TEMP/mobile"
          while IFS= read -r -d '' path; do
            [[ $path =~ $native ]] || continue
            if [[ $path =~ ^apps/([^/]+)/ ]]; then touched+=("${BASH_REMATCH[1]}"); else shared=1; fi
          done < "$RUNNER_TEMP/changed"
          apps=()
          while read -r app; do
            selected=$shared
            for name in "${touched[@]}"; do
              if [[ $name == "$app" ]]; then selected=1; fi
            done
            if ((selected)); then apps+=("$app"); fi
          done < "$RUNNER_TEMP/mobile"
          mobile=$(printf '%s\n' "${apps[@]}" | jq -Rsc 'split("\n") | map(select(length > 0))')
          echo "mobile=$mobile" >> "$GITHUB_OUTPUT"

  app:
    name: App Store
    needs: apps
    if: needs.apps.outputs.mobile != '[]'
    concurrency:
      group: app-store-build-${{ github.ref }}-${{ matrix.app }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.apps.outputs.mobile) }}
    # A branch signs here on purpose, so the job waits for the user's approval: `.github/releasing.md`, Host setup.
    environment: signing
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      APP_VARIANT: production
      DESLOP_DOMAIN: ${{ vars.DESLOP_DOMAIN }}
      EAS_BUILD_DISABLE_EXPO_DOCTOR_STEP: 1
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with: {eas: 'true', ios: 'true'}
      # The same signed build Release uploads, with the same provisioning profiles; nothing is uploaded.
      - name: Build the signed App Store app
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas build --local --profile production --platform ios --non-interactive --output "$RUNNER_TEMP/app.ipa"
