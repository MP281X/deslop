name: Release app

# One mobile app: its JavaScript ships as an EAS Update from Linux; a native fingerprint without a build yet goes to the Mac.
on:
  workflow_call:
    inputs:
      app: {type: string, required: true}

env:
  APP_VARIANT: production
  EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
  RELEASE_NUMBER: ${{ github.run_number }}

jobs:
  update:
    name: Update
    runs-on: ubuntu-26.04
    outputs:
      artifact: ${{ steps.fingerprint.outputs.artifact }}
      native: ${{ steps.fingerprint.outputs.native }}
    defaults:
      run:
        working-directory: apps/${{ inputs.app }}
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 0}
      - uses: ./.github/actions/setup
        with: {eas: 'true'}

      # Nothing ships when neither the app nor what it builds from changed since its last update.
      - name: Check for changes since the last update
        id: changes
        run: |
          group=$(eas update:list --branch production --limit 1 --json --non-interactive | jq -r '.currentPage[0].group // empty')
          commit=$([[ -n $group ]] && eas update:view "$group" --json | jq -r '.[0].gitCommitHash' || true)
          changed=true
          if [[ -n $commit ]] && git cat-file -e "$commit^{commit}" && git diff --quiet "$commit" -- . ../../packages ../../pnpm-lock.yaml; then changed=false; fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

      # A shipped build leaves an artifact named for its fingerprint that expires after 80 days, ten before TestFlight drops the build, so the next release builds it again; a failed build leaves none and is tried again.
      - name: Check for a native change
        id: fingerprint
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          artifact="${{ inputs.app }}-app-store-$(eas fingerprint:generate --platform ios --build-profile production --json --non-interactive | jq -r .hash)"
          echo "artifact=$artifact" >> "$GITHUB_OUTPUT"
          echo "native=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$artifact" --jq '[.artifacts[] | select(.expired | not)] | length == 0')" >> "$GITHUB_OUTPUT"

      # The fingerprint runs alongside Verify; the update only ships once it passes.
      - name: Await verification
        if: steps.changes.outputs.changed == 'true' && steps.fingerprint.outputs.native == 'false'
        uses: ./.github/actions/await-verify

      - name: Publish the EAS Update
        if: steps.changes.outputs.changed == 'true' && steps.fingerprint.outputs.native == 'false'
        run: eas update --channel production --environment production --platform ios --non-interactive --message "$(git log -1 --format=%s)"

  app-store:
    name: App Store
    needs: update
    if: needs.update.outputs.native == 'true'
    concurrency: ios-${{ inputs.app }}
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      EAS_BUILD_DISABLE_EXPO_DOCTOR_STEP: 1
    defaults:
      run:
        working-directory: apps/${{ inputs.app }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with: {eas: 'true', ios: 'true'}
      - name: Build the App Store app
        run: eas build --local --profile production --platform ios --non-interactive --output "$RUNNER_TEMP/app.ipa"
      # The build overlaps Verify; nothing reaches Apple until it passes.
      - name: Await verification
        uses: ./.github/actions/await-verify
      # EAS hands the build to Apple on its own servers; waiting for that kept the Mac idle for about 14 minutes.
      - name: Submit to the App Store
        run: eas submit --profile production --platform ios --non-interactive --no-wait --path "$RUNNER_TEMP/app.ipa"
      - name: Publish the EAS Update for the new build
        run: eas update --channel production --environment production --platform ios --non-interactive --message "$(git log -1 --format=%s)"
      - name: Record the shipped build
        uses: actions/upload-artifact@v7
        with:
          name: ${{ needs.update.outputs.artifact }}
          path: ${{ runner.temp }}/app.ipa
          retention-days: 80
