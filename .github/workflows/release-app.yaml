name: Release app

on:
  workflow_call:
    inputs:
      app: {type: string, required: true}
    secrets:
      EXPO_TOKEN: {required: true}
      ASC_KEY_ID: {required: true}
      ASC_ISSUER_ID: {required: true}
      ASC_KEY_P8: {required: true}

env:
  APP: ${{ inputs.app }}
  APP_VARIANT: production
  DESLOP_DOMAIN: ${{ vars.DESLOP_DOMAIN }}
  RELEASE_NUMBER: ${{ github.run_number }}

# bash -eo pipefail: a failed command inside a pipeline or an assignment fails its step.
defaults:
  run:
    shell: bash

jobs:
  update:
    name: Update
    # The environment is limited to `main`: `.github/releasing.md`, Host setup.
    environment: release
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    outputs:
      app-store: ${{ steps.app-store.outputs.id }}
      artifact: ${{ steps.fingerprint.outputs.artifact }}
      fingerprint: ${{ steps.fingerprint.outputs.hash }}
      native: ${{ steps.fingerprint.outputs.native }}
    defaults:
      run:
        working-directory: apps/${{ inputs.app }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {fetch-depth: 0}
      - uses: ./.github/actions/setup
        with: {eas: 'true'}

      # A rerun of an older release finds a newer one already served and ships nothing over it.
      - name: Find the served update
        id: served
        uses: ./.github/actions/served-update
        with:
          app: ${{ inputs.app }}
          expo-token: ${{ secrets.EXPO_TOKEN }}

      # Nothing ships when neither the app nor what it builds from changed since its last update.
      - name: Check for changes since the last update
        id: changes
        if: steps.served.outputs.superseded == 'false'
        env:
          COMMIT: ${{ steps.served.outputs.commit }}
        run: |
          changed=true
          if [[ -n $COMMIT ]] && git cat-file -e "$COMMIT^{commit}" && git diff --quiet "$COMMIT" -- . ../../packages ../../pnpm-lock.yaml; then changed=false; fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

      # Apple's acceptance leaves a receipt from a Release run on main, named for the fingerprint, that expires after 80 days, ten before TestFlight drops the build, so the next release builds it again; a failed upload leaves none and is tried again.
      - name: Check for a native change
        id: fingerprint
        if: steps.served.outputs.superseded == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          hash=$(eas fingerprint:generate --platform ios --build-profile production --json --non-interactive | jq -r .hash)
          artifact="$APP-app-store-$hash"
          runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$artifact&per_page=100" --jq '[.artifacts[] | select((.expired | not) and .workflow_run.head_branch == "main") | .workflow_run.id] | unique | .[]')
          native=true
          for run in $runs; do
            producer=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" --jq '[.path, .event, .head_repository.full_name] | join(" ")')
            if [[ $producer == ".github/workflows/deploy.yaml push $GITHUB_REPOSITORY" ]]; then native=false; fi
          done
          echo "artifact=$artifact" >> "$GITHUB_OUTPUT"
          echo "hash=$hash" >> "$GITHUB_OUTPUT"
          echo "native=$native" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/app-store-connect
        if: steps.fingerprint.outputs.native == 'true'
        with:
          key-id: ${{ secrets.ASC_KEY_ID }}
          issuer-id: ${{ secrets.ASC_ISSUER_ID }}
          key: ${{ secrets.ASC_KEY_P8 }}

      # Only the App Store Connect website creates an app record, so a new app's release fails here until it exists; a new record gets an internal TestFlight group with the testers of the team's other internal groups.
      - name: Find the App Store app
        id: app-store
        if: steps.fingerprint.outputs.native == 'true'
        run: |
          api() { curl --fail-with-body --silent --show-error --globoff --header "Authorization: Bearer $ASC_TOKEN" --header 'Content-Type: application/json' "https://api.appstoreconnect.apple.com/v1/$1" "${@:2}"; }
          bundle=$(vp exec expo config --type public --json | jq -r .ios.bundleIdentifier)
          app=$(api "apps?filter[bundleId]=$bundle" | jq -r --arg bundle "$bundle" '.data[] | select(.attributes.bundleId == $bundle) | .id')
          if [[ -z $app ]]; then
            echo "::error::No App Store Connect app has the bundle ID $bundle. Create it at https://appstoreconnect.apple.com/apps (+, New App, iOS, bundle ID $bundle), then run: gh run rerun $GITHUB_RUN_ID --failed"
            exit 1
          fi
          groups=$(api "betaGroups?filter[app]=$app&filter[isInternalGroup]=true" | jq '.data | length')
          if [[ $groups == 0 ]]; then
            testers=$(api 'betaGroups?filter[isInternalGroup]=true&include=betaTesters&limit=200' | jq -c '[.included[]? | select(.type == "betaTesters") | {type, id}] | unique')
            api betaGroups --data "$(jq -cn --arg app "$app" --argjson testers "$testers" '{data: {type: "betaGroups", attributes: {name: "Internal", isInternalGroup: true, hasAccessToAllBuilds: true}, relationships: {app: {data: {type: "apps", id: $app}}, betaTesters: {data: $testers}}}}')" > /dev/null
          fi
          echo "id=$app" >> "$GITHUB_OUTPUT"

      - name: Publish the EAS Update
        if: steps.changes.outputs.changed == 'true' && steps.fingerprint.outputs.native == 'false'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas update --channel production --environment production --platform ios --non-interactive --message="$(git log -1 --format=%s)"

  app-store:
    name: App Store
    needs: update
    if: ${{ !cancelled() && needs.update.result == 'success' && needs.update.outputs.native == 'true' }}
    # The environment is limited to `main`: `.github/releasing.md`, Host setup.
    environment: release
    concurrency: ios-${{ inputs.app }}
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      EAS_BUILD_DISABLE_EXPO_DOCTOR_STEP: 1
    defaults:
      run:
        working-directory: apps/${{ inputs.app }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {fetch-depth: 0}

      # Apple refuses a build number it has, so a retry after an accepted upload resumes at the update.
      - name: Find this run's App Store receipt
        id: receipt
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT: ${{ needs.update.outputs.artifact }}
        run: |
          uploaded=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=$ARTIFACT" --jq '.artifacts | length > 0')
          echo "uploaded=$uploaded" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/setup
        with:
          eas: 'true'
          ios: ${{ steps.receipt.outputs.uploaded == 'false' }}
      # A rerun of an older release's job finds a newer one already served and ships nothing over it.
      - name: Find the served update
        id: served
        uses: ./.github/actions/served-update
        with:
          app: ${{ inputs.app }}
          expo-token: ${{ secrets.EXPO_TOKEN }}
      - name: Build the App Store app
        if: steps.served.outputs.superseded == 'false' && steps.receipt.outputs.uploaded == 'false'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas build --local --profile production --platform ios --non-interactive --output "$RUNNER_TEMP/app.ipa"
      - name: Upload to the App Store
        id: upload
        if: steps.served.outputs.superseded == 'false' && steps.receipt.outputs.uploaded == 'false'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          APP_STORE_ID: ${{ needs.update.outputs.app-store }}
          FINGERPRINT: ${{ needs.update.outputs.fingerprint }}
        run: |
          jq -n --arg app "$APP" --arg id "$APP_STORE_ID" --arg build "$RELEASE_NUMBER" --arg fingerprint "$FINGERPRINT" --arg commit "$GITHUB_SHA" \
            '{app: $app, appStoreId: $id, version: "0.1.\($build)", build: $build, fingerprint: $fingerprint, commit: $commit}' > "$RUNNER_TEMP/receipt.json"
          umask 077
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          printf '%s\n' "$ASC_KEY_P8" > "$HOME/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8"
          xcrun altool --upload-package "$RUNNER_TEMP/app.ipa" --api-key "$ASC_KEY_ID" --api-issuer "$ASC_ISSUER_ID"
          echo "- $APP uploaded: https://appstoreconnect.apple.com/apps/$APP_STORE_ID/testflight/ios" >> "$GITHUB_STEP_SUMMARY"
      - name: Remove the App Store Connect key
        if: always()
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: rm -f "$HOME/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8"
      # Recorded the moment Apple accepts, even when the run is cancelled, so neither a retry nor the next release uploads this fingerprint again.
      - name: Record Apple's acceptance
        if: always() && steps.upload.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ needs.update.outputs.artifact }}
          path: ${{ runner.temp }}/receipt.json
          retention-days: 80
      # The build takes minutes, in which a newer release can have shipped.
      - name: Find the served update again
        id: served-again
        if: steps.served.outputs.superseded == 'false'
        uses: ./.github/actions/served-update
        with:
          app: ${{ inputs.app }}
          expo-token: ${{ secrets.EXPO_TOKEN }}
      - name: Publish the EAS Update for the new build
        if: steps.served-again.outputs.superseded == 'false'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas update --channel production --environment production --platform ios --non-interactive --message="$(git log -1 --format=%s)"
