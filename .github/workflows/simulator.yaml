name: Simulator builds

on:
  push:
    branches-ignore: [main]
    paths:
      - apps/**
      - packages/**
      - pnpm-lock.yaml
      - .github/workflows/simulator*.yaml
      - .github/actions/setup/**

permissions:
  contents: read
  actions: read

# bash -eo pipefail: a failed command inside a pipeline or an assignment fails its step.
defaults:
  run:
    shell: bash

jobs:
  apps:
    name: Discover apps
    runs-on: ubuntu-26.04
    outputs:
      mobile: ${{ steps.apps.outputs.mobile }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {fetch-depth: 2}
      - name: Discover mobile apps
        id: mobile
        uses: ./.github/actions/mobile-apps
      - name: Discover changed mobile inputs
        id: apps
        env:
          BASE: ${{ github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
          MOBILE: ${{ steps.mobile.outputs.apps }}
        run: |
          mobile=$MOBILE
          mapfile -t apps < <(jq -r '.[]' <<< "$MOBILE")
          paths=("${apps[@]/#/apps/}" packages pnpm-lock.yaml .github/workflows .github/actions/setup)
          if [[ $BASE =~ ^0+$ ]]; then
            BASE=$(gh api "repos/$GITHUB_REPOSITORY/compare/$DEFAULT_BRANCH...$GITHUB_SHA" --jq .merge_base_commit.sha)
          fi
          git cat-file -e "$BASE^{commit}" 2>/dev/null || git fetch --no-tags --depth=1 origin "$BASE"
          if git diff --quiet "$BASE" HEAD -- "${paths[@]}"; then mobile='[]'; fi
          echo "mobile=$mobile" >> "$GITHUB_OUTPUT"

  app:
    name: App
    needs: apps
    if: needs.apps.outputs.mobile != '[]'
    # A skipped web-only run must not cancel an unfinished native artifact.
    concurrency:
      group: simulator-${{ github.ref }}-${{ matrix.app }}
      cancel-in-progress: true
    strategy:
      matrix:
        app: ${{ fromJSON(needs.apps.outputs.mobile) }}
    uses: ./.github/workflows/simulator-app.yaml
    with:
      app: ${{ matrix.app }}
    secrets:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
