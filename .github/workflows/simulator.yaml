name: iPhone builds

# Linux computes the same fingerprints as the Mac, so a Mac starts only for a fingerprint without an artifact.
on:
  push:
    branches-ignore: [main]

env:
  DESLOP_DOMAIN: ${{ vars.DESLOP_DOMAIN }}

# bash -eo pipefail: a failed command inside a pipeline or an assignment fails its step.
defaults:
  run:
    shell: bash

jobs:
  fingerprint:
    name: Fingerprint
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    # A newer push decides for the branch; a run that already decided keeps its builds.
    concurrency:
      group: fingerprint-${{ github.ref }}
      cancel-in-progress: true
    outputs:
      simulator: ${{ steps.fingerprint.outputs.simulator }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      # A stack's top branch holds every lower layer's commits, so only it builds. An artifact's name holds a hash of this workflow and the setup action, so an edit to either builds every app again.
      - name: Find builds for each fingerprint
        id: fingerprint
        env:
          GH_TOKEN: ${{ github.token }}
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          builds=()
          above=$(gh pr list --base "$GITHUB_REF_NAME" --state open --json url --jq '.[].url')
          if [[ -z $above ]]; then
            recipe=$(git rev-parse HEAD:.github/workflows/simulator.yaml HEAD:.github/actions/setup | sha256sum | cut -c1-12)
            for app in opm stash; do
              fingerprint=$(cd "apps/$app" && APP_VARIANT=development eas fingerprint:generate --platform ios --build-profile simulator --json --non-interactive | jq -r .hash)
              artifact="$app-simulator-$fingerprint-$recipe"
              held=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$artifact" --jq '[.artifacts[] | select(.expired | not)] | length')
              if [[ $held == 0 ]]; then builds+=("$(jq -cn --arg app "$app" --arg artifact "$artifact" '{$app, $artifact}')"); fi
            done
          fi
          echo "simulator=$(jq -sc . <<< "${builds[*]}")" >> "$GITHUB_OUTPUT"

  simulator:
    name: Simulator ${{ matrix.app }}
    needs: fingerprint
    if: needs.fingerprint.outputs.simulator != '[]'
    # One build per name, whatever the branch: every job waiting behind the same build finds its artifact and stops, and a newer push never cancels a build it would make again.
    concurrency:
      group: ${{ matrix.artifact }}
      queue: max
    strategy:
      matrix:
        include: ${{ fromJSON(needs.fingerprint.outputs.simulator) }}
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      APP_VARIANT: development
      EAS_BUILD_DISABLE_EXPO_DOCTOR_STEP: 1
      # The Simulator host is Apple silicon; the default universal binary compiles every file twice.
      GYM_XCARGS: ARCHS=arm64
      # The bundle step stays though agents replace the bundle: SKIP_BUNDLING also skips expo-updates' embedded manifest, and the app then stops at launch.
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      # A job that waited behind a build of the same name finds its artifact and stops.
      - name: Build the Simulator app
        working-directory: apps/${{ matrix.app }}
        env:
          GH_TOKEN: ${{ github.token }}
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          ARTIFACT: ${{ matrix.artifact }}
        run: |
          held=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$ARTIFACT" --jq '[.artifacts[] | select(.expired | not)] | length')
          if [[ $held != 0 ]]; then exit 0; fi
          eas build --local --profile simulator --platform ios --non-interactive --output "$RUNNER_TEMP/simulator.tar.gz"
      - name: Upload the Simulator app
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ runner.temp }}/simulator.tar.gz
          retention-days: 90
          if-no-files-found: ignore
