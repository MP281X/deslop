name: iPhone builds

# Linux fingerprints the build inputs, so a Mac starts only for a fingerprint without an artifact.
on:
  push:
    branches-ignore: [main]

env:
  DESLOP_DOMAIN: ${{ vars.DESLOP_DOMAIN }}
  APPLE_TEAM_ID: 99K7MQUK7F

# bash -eo pipefail: a failed command inside a pipeline or an assignment fails its step.
defaults:
  run:
    shell: bash

jobs:
  fingerprint:
    name: Fingerprint
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    # A newer push decides for the branch; a run that already decided keeps its builds.
    concurrency:
      group: fingerprint-${{ github.ref }}
      cancel-in-progress: true
    outputs:
      simulator: ${{ steps.fingerprint.outputs.simulator }}
    steps:
      - uses: actions/checkout@v7
      # A stack's top branch holds every lower layer's commits, so only it builds. The recipe hash also changes when the workflow changes how it builds.
      - name: Find builds for each fingerprint
        id: fingerprint
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          builds=()
          above=$(gh pr list --base "$GITHUB_REF_NAME" --state open --json url --jq '.[].url')
          if [[ -z $above ]]; then
            recipe=$(git rev-parse HEAD:.github/workflows/simulator.yaml | sha256sum | cut -c1-12)
            for app in opm stash trips; do
              inputs=$(git rev-parse "HEAD:apps/$app" HEAD:packages HEAD:package.json HEAD:pnpm-lock.yaml HEAD:pnpm-workspace.yaml HEAD:vite.config.ts)
              fingerprint=$(printf '%s\n' "$inputs" "$DESLOP_DOMAIN" | sha256sum | cut -c1-64)
              artifact="$app-simulator-$fingerprint-$recipe"
              held=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$artifact" --jq '[.artifacts[] | select(.expired | not)] | length')
              if [[ $held == 0 ]]; then builds+=("$(jq -cn --arg app "$app" --arg artifact "$artifact" '{$app, $artifact}')"); fi
            done
          fi
          echo "simulator=$(jq -sc . <<< "${builds[*]}")" >> "$GITHUB_OUTPUT"

  simulator:
    name: Simulator ${{ matrix.app }}
    needs: fingerprint
    if: needs.fingerprint.outputs.simulator != '[]'
    # One build per name, whatever the branch: every job waiting behind the same build finds its artifact and stops, and a newer push never cancels a build it would make again.
    concurrency:
      group: ${{ matrix.artifact }}
      queue: max
    strategy:
      matrix:
        include: ${{ fromJSON(needs.fingerprint.outputs.simulator) }}
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      # A job that waited behind a build of the same name finds its artifact and stops.
      - name: Find the Simulator build
        id: artifact
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT: ${{ matrix.artifact }}
        run: |
          needed=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$ARTIFACT" --jq '[.artifacts[] | select(.expired | not)] | length == 0')
          echo "needed=$needed" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        if: steps.artifact.outputs.needed == 'true'
      - uses: voidzero-dev/setup-vp@v1.22.0
        if: steps.artifact.outputs.needed == 'true'
        with:
          node-version: '26'
          run-install: true
      - name: Build the Simulator app
        if: steps.artifact.outputs.needed == 'true'
        working-directory: apps/${{ matrix.app }}
        env:
          APP: ${{ matrix.app }}
        run: |
          vp run build
          vp exec cap sync ios
          # Keep ad hoc signing for the embedded extensions and build only for the Apple silicon host.
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/derived" ARCHS=arm64 CODE_SIGN_IDENTITY=- \
            "DEVELOPMENT_TEAM=$APPLE_TEAM_ID" "DESLOP_DOMAIN=$DESLOP_DOMAIN" build
          mv "$RUNNER_TEMP/derived/Build/Products/Debug-iphonesimulator/App.app" "$RUNNER_TEMP/${APP}dev.app"
          tar -czf "$RUNNER_TEMP/simulator.tar.gz" -C "$RUNNER_TEMP" "${APP}dev.app"
      - name: Upload the Simulator app
        if: steps.artifact.outputs.needed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ runner.temp }}/simulator.tar.gz
          retention-days: 90
          if-no-files-found: error
