name: iPhone builds

# Linux computes the same fingerprints as the Mac, so a Mac starts only for a fingerprint without an artifact.
# The Simulator build needs no provisioning profile, so Linux also checks that the App Store profiles hold what each app's production config declares.
on:
  push:
    branches-ignore: [main]
    paths:
      - apps/**
      - packages/**
      - pnpm-lock.yaml
      - .github/workflows/simulator.yaml
      - .github/actions/setup/**
      - .github/scripts/app-store-profiles.py

env:
  DESLOP_DOMAIN: ${{ vars.DESLOP_DOMAIN }}

# bash -eo pipefail: a failed command inside a pipeline or an assignment fails its step.
defaults:
  run:
    shell: bash

jobs:
  fingerprint:
    name: Fingerprint
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    # A newer push decides for the branch; a run that already decided keeps its builds.
    concurrency:
      group: fingerprint-${{ github.ref }}
      cancel-in-progress: true
    outputs:
      simulator: ${{ steps.fingerprint.outputs.simulator }}
    steps:
      # A stack's top branch holds every lower layer's commits, so only it builds.
      - name: Is this the top of its stack?
        id: stack
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          above=$(gh pr list --repo "$GITHUB_REPOSITORY" --base "$GITHUB_REF_NAME" --state open --json url --jq '.[].url')
          if [[ -n $above ]]; then
            echo "- $GITHUB_REF_NAME is below $above in a stack; its top branch builds" >> "$GITHUB_STEP_SUMMARY"
            echo "top=false" >> "$GITHUB_OUTPUT"
          else
            echo "top=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        if: steps.stack.outputs.top == 'true'
      - uses: ./.github/actions/setup
        if: steps.stack.outputs.top == 'true'
        with: {eas: 'true'}
      - name: Discover mobile apps
        id: mobile
        if: steps.stack.outputs.top == 'true'
        uses: ./.github/actions/mobile-apps
      # Each build is named by its profile's fingerprint and by the workflow and setup action that make it, so an edit to either builds every app again; one already made under that name is reused.
      # A push that changes nothing native finds every build already made, so no diff decides which apps to look at.
      - name: Find builds for each fingerprint
        id: fingerprint
        if: steps.stack.outputs.top == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          # `eas fingerprint:generate` logs in before it computes anything.
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          MOBILE: ${{ steps.mobile.outputs.apps }}
        run: |
          shopt -s inherit_errexit nullglob
          recipe=$(git rev-parse HEAD:.github/workflows/simulator.yaml HEAD:.github/actions/setup | sha256sum | cut -c1-12)
          decide() {
            local app=$1 artifact run
            artifact="$app-simulator-$(cd "apps/$app" && APP_VARIANT=development eas fingerprint:generate --platform ios --build-profile simulator --json --non-interactive | jq -r .hash)-$recipe"
            run=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$artifact" --jq '[.artifacts[] | select(.expired | not) | .workflow_run.id] | first // empty')
            if [[ -n $run ]]; then
              echo "- $app reuses $artifact from $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$run" >> "$RUNNER_TEMP/decided/$app.md"
            else
              jq -cn --arg app "$app" --arg artifact "$artifact" '{$app, $artifact}' > "$RUNNER_TEMP/decided/$app.json"
            fi
          }
          mkdir "$RUNNER_TEMP/decided"
          # The apps decide at once, as each fingerprint takes several seconds; any app failing fails the step.
          pids=()
          for app in $(jq -r '.[]' <<< "$MOBILE"); do
            decide "$app" &
            pids+=($!)
          done
          for pid in "${pids[@]}"; do wait "$pid"; done
          for summary in "$RUNNER_TEMP"/decided/*.md; do cat "$summary" >> "$GITHUB_STEP_SUMMARY"; done
          builds=$(jq -sc . "$RUNNER_TEMP"/decided/*.json /dev/null)
          if [[ $builds != '[]' ]]; then echo "simulator=$builds" >> "$GITHUB_OUTPUT"; fi

      - uses: ./.github/actions/app-store-connect
        if: steps.stack.outputs.top == 'true'
        with:
          key-id: ${{ secrets.ASC_KEY_ID }}
          issuer-id: ${{ secrets.ASC_ISSUER_ID }}
          key: ${{ secrets.ASC_KEY_P8 }}
      # What signing would refuse fails here, in seconds, with the signing workflow to run; the Simulator builds go ahead either way.
      - name: Check App Store profiles against each app's entitlements
        if: steps.stack.outputs.top == 'true'
        env:
          APP_VARIANT: production
          MOBILE: ${{ steps.mobile.outputs.apps }}
        run: |
          shopt -s inherit_errexit nullglob
          check() {
            cd "apps/$1"
            vp exec expo config --type introspect --json > "$RUNNER_TEMP/profiles/$1.json"
            python3 ../../.github/scripts/app-store-profiles.py check "$RUNNER_TEMP/profiles/$1.json" > "$RUNNER_TEMP/profiles/$1.md"
          }
          mkdir "$RUNNER_TEMP/profiles"
          pids=()
          for app in $(jq -r '.[]' <<< "$MOBILE"); do
            check "$app" &
            pids+=($!)
          done
          failed=0
          for pid in "${pids[@]}"; do wait "$pid" || failed=1; done
          for summary in "$RUNNER_TEMP"/profiles/*.md; do cat "$summary" >> "$GITHUB_STEP_SUMMARY"; done
          exit "$failed"

  simulator:
    name: Simulator ${{ matrix.app }}
    needs: fingerprint
    # The fingerprint job's last step only checks signing, so a profile it fails on still leaves the decided builds to run.
    if: ${{ !cancelled() && needs.fingerprint.outputs.simulator }}
    # One build per name, whatever the branch: every job waiting behind the same build finds its artifact and stops, and a newer push never cancels a build it would make again.
    concurrency:
      group: ${{ matrix.artifact }}
      queue: max
    strategy:
      matrix:
        include: ${{ fromJSON(needs.fingerprint.outputs.simulator) }}
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      APP_VARIANT: development
      EAS_BUILD_DISABLE_EXPO_DOCTOR_STEP: 1
      # The Simulator host is Apple silicon; the default universal binary compiles every file twice.
      GYM_XCARGS: ARCHS=arm64
      # Agents embed the branch's own bundle before installing, so the build's bundle is never run: EAS skips its eager bundle and Xcode its bundle phase.
      EAS_BUILD_DISABLE_BUNDLE_JAVASCRIPT_STEP: 1
      SKIP_BUNDLING: 1
    steps:
      # A build of the same name may have finished since the decision; it is this one.
      - name: Look for a build made meanwhile
        id: made
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT: ${{ matrix.artifact }}
        run: |
          count=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$ARTIFACT" --jq '[.artifacts[] | select(.expired | not)] | length')
          echo "count=$count" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        if: steps.made.outputs.count == 0
      - uses: ./.github/actions/setup
        if: steps.made.outputs.count == 0
        with: {eas: 'true', ios: 'true'}
      - name: Build the Simulator app
        if: steps.made.outputs.count == 0
        working-directory: apps/${{ matrix.app }}
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas build --local --profile simulator --platform ios --non-interactive --output "$RUNNER_TEMP/simulator.tar.gz"
      - name: Upload the Simulator app
        if: steps.made.outputs.count == 0
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ runner.temp }}/simulator.tar.gz
          retention-days: 90
