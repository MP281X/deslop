name: Simulator builds

# Discovery ignores web-only changes; a mobile app's native fingerprint decides whether the Mac builds it.
on:
  push:
    branches-ignore: [main]
    paths:
      - apps/**
      - packages/**
      - pnpm-lock.yaml
      - .github/workflows/simulator*.yaml
      - .github/actions/setup/**

permissions:
  contents: read
  actions: read

jobs:
  apps:
    name: Discover apps
    runs-on: ubuntu-26.04
    outputs:
      mobile: ${{ steps.apps.outputs.mobile }}
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 2}
      - name: Discover changed mobile inputs
        id: apps
        env:
          BASE: ${{ github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          configs=(apps/*/app.config.ts)
          apps=("${configs[@]%/app.config.ts}")
          paths=("${apps[@]}" packages pnpm-lock.yaml .github/workflows .github/actions/setup)
          apps=("${apps[@]#apps/}")
          mobile=$(printf '%s\n' "${apps[@]}" | jq -Rsc 'split("\n") | map(select(length > 0))')
          if [[ $BASE =~ ^0+$ ]]; then
            BASE=$(gh api "repos/$GITHUB_REPOSITORY/compare/$DEFAULT_BRANCH...$GITHUB_SHA" --jq .merge_base_commit.sha)
          fi
          git cat-file -e "$BASE^{commit}" 2>/dev/null || git fetch --no-tags --depth=1 origin "$BASE"
          if git diff --quiet "$BASE" HEAD -- "${paths[@]}"; then mobile='[]'; fi
          echo "mobile=$mobile" >> "$GITHUB_OUTPUT"

  app:
    name: App
    needs: apps
    if: needs.apps.outputs.mobile != '[]'
    # A skipped web-only run must not cancel an unfinished native artifact.
    concurrency:
      group: simulator-${{ github.ref }}-${{ matrix.app }}
      cancel-in-progress: true
    strategy:
      matrix:
        app: ${{ fromJSON(needs.apps.outputs.mobile) }}
    uses: ./.github/workflows/simulator-app.yaml
    with:
      app: ${{ matrix.app }}
    secrets: inherit
