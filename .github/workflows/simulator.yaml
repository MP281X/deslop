name: Simulator builds

# Only a change to what the native build reads can change its fingerprint.
on:
  push:
    branches-ignore: [main]
    paths:
      - apps/stash/**
      - apps/opm/**
      - apps/trips/**
      - packages/**
      - pnpm-lock.yaml
      - .github/workflows/simulator*.yaml
      - .github/actions/setup/**

# A newer push to the same branch replaces the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  app:
    name: App
    strategy:
      matrix:
        app: [stash, opm, trips]
    uses: ./.github/workflows/simulator-app.yaml
    with:
      app: ${{ matrix.app }}
    secrets: inherit
