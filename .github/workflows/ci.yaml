name: CI

on:
  push:
    branches-ignore: [main]

# A newer push to the same branch replaces the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Check and test run side by side; neither reads the other's results.
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: voidzero-dev/setup-vp@v1
        with: {node-version: '26', cache: true, run-install: true}
      - run: vp check && vp run check

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: voidzero-dev/setup-vp@v1
        with: {node-version: '26', cache: true, run-install: true}
      - run: vp run test
