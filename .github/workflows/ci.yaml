name: CI

on:
  push:
    branches-ignore: [main]

# A newer push to the same branch replaces the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: voidzero-dev/setup-vp@v1
        with: {node-version: '26', cache: true, run-install: true}

      - name: Check
        run: vp run check

      - name: Test
        run: vp run test
