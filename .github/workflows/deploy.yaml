name: Build and Deploy

on: [push]

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Vite+
        uses: voidzero-dev/setup-vp@v1
        with: {node-version: '26', cache: true, run-install: true}

      - name: Check
        run: vp run check

      - name: Test
        run: vp run test

      - name: Docker Login
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        if: github.ref == 'refs/heads/main'
        env:
          VITE_OTEL_URL: https://otel.mp281x.xyz
        run: vp run build

      - name: Docker
        if: github.ref == 'refs/heads/main'
        run: |
          image_prefix=$(echo "ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]')

          for app in portfolio; do
            docker build ./apps/$app --tag $image_prefix-$app:latest
            docker push $image_prefix-$app:latest
          done

      - name: Publish
        if: github.ref == 'refs/heads/main'
        working-directory: tools/workflow
        run: |
          vp run build
          npm view "@deslop/workflow@$(npm pkg get version | tr -d '"')" version >/dev/null 2>&1 || npm publish
