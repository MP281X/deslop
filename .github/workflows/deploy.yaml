name: Deploy

on:
  push:
    branches: [main]

# A newer push replaces the older run; each release ships everything since the last one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: voidzero-dev/setup-vp@v1
        with: {node-version: '26', cache: true, run-install: true}

      - name: Check
        run: vp run check

      - name: Test
        run: vp run test

      - name: Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_NUMBER: ${{ github.run_number }}
          VITE_OTEL_URL: https://otel.mp281x.xyz
        # pnpm applies publishConfig while packing; npm uploads the README metadata that pnpm omits.
        run: |
          for package in tools/coding-standards apps/scope apps/stash; do
            vp -C $package pm version "0.1.$RELEASE_NUMBER" -- --no-git-tag-version --no-git-checks
          done
          vp run build

          echo "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          for app in auth-server portfolio scope stash; do
            docker build apps/$app --tag ghcr.io/${GITHUB_REPOSITORY,,}-$app:latest --tag ghcr.io/${GITHUB_REPOSITORY,,}-$app:$GITHUB_SHA
            docker push --all-tags ghcr.io/${GITHUB_REPOSITORY,,}-$app
          done

          (cd apps/scope && npm pkg delete devDependencies)
          for package in tools/coding-standards apps/scope; do
            vp -C $package pm pack --pack-destination "$RUNNER_TEMP/$package"
            npm publish "$RUNNER_TEMP/$package"/*.tgz
          done

  # JavaScript ships as an EAS Update, and only a new native fingerprint builds for TestFlight.
  ios:
    needs: build-and-deploy
    strategy:
      matrix:
        app: [stash]
    concurrency: ios-${{ matrix.app }}
    runs-on: xcode-27
    timeout-minutes: 60
    permissions:
      contents: read
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      APP_VARIANT: production
      RELEASE_NUMBER: ${{ github.run_number }}
      # npm, because pnpm applies the workspace's strict peer checks to the EAS CLI's own dependencies.
      EAS: npx --yes eas-cli@latest
    steps:
      - uses: actions/checkout@v5
        with: {fetch-depth: 0}
      - uses: voidzero-dev/setup-vp@v1
        with: {node-version: '26', cache: true, run-install: true}

      - name: Release
        shell: bash
        run: |
          set -euo pipefail
          group=$($EAS update:list --branch production --limit 1 --json --non-interactive | jq -r '.currentPage[0].group // empty')
          released=$([[ -n $group ]] && $EAS update:view "$group" --json | jq -r '.[0].gitCommitHash' || true)
          if [[ -n $released ]] && git cat-file -e "$released^{commit}" 2>/dev/null && git diff --quiet "$released" -- . ../../packages ../../pnpm-lock.yaml; then exit; fi
          hash=$($EAS fingerprint:generate --platform ios --build-profile production --json --non-interactive | jq -r .hash)
          built=$($EAS update:list --branch production --runtime-version "$hash" --limit 1 --json --non-interactive | jq '.currentPage | length > 0')
          if [[ $built != true ]]; then
            sudo xcode-select --switch /Applications/Xcode_27.1.app
            $EAS build --local --profile production --platform ios --non-interactive --output "$RUNNER_TEMP/app.ipa"
            $EAS submit --profile production --platform ios --non-interactive --path "$RUNNER_TEMP/app.ipa"
          fi
          $EAS update --channel production --environment production --platform ios --non-interactive --message "$(git log -1 --format=%s)"
