name: Release

# The file keeps its name: npm trusts `deploy.yaml` to publish the packages.
# A pull request runs Verify on GitHub's merge with its base; main runs it on what it ships, then releases.
on:
  pull_request:
  push:
    branches: [main]

# A newer push replaces the older run: a pull request's ref is its merge ref, and each release ships everything since the last one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# bash -eo pipefail: a failed command inside a pipeline or an assignment fails its step.
defaults:
  run:
    shell: bash

env:
  APP_VARIANT: production
  DESLOP_DOMAIN: ${{ vars.DESLOP_DOMAIN }}

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    permissions:
      actions: write
      contents: read
      id-token: write
    outputs:
      app-store: ${{ steps.native.outputs.apps }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      # The key rolls with each run: a job restores the newest entry it can read, so a pull request starts from main's.
      - uses: actions/cache@v6
        with:
          path: node_modules/.vite/task-cache
          key: vite-task-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: vite-task-
      - name: Format, lint, types, dead code and repository checks
        run: vp run check
      - name: Build
        run: vp run build
      - name: Probe each built server's authorization
        run: for app in auth deploy gateway opm portfolio scope stash trips; do node "apps/$app/dist/server.js" probe; done
      - name: Test
        run: vp run test

      # Apple's acceptance leaves a receipt named for the fingerprint that expires after 80 days, ten before TestFlight drops the build; a fingerprint without one builds on a Mac.
      - name: Find the iPhone apps with a native change
        id: native
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          builds=()
          for app in opm stash trips; do
            fingerprint=$(cd "apps/$app" && eas fingerprint:generate --platform ios --build-profile production --json --non-interactive | jq -r .hash)
            artifact="$app-app-store-$fingerprint"
            held=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$artifact" --jq '[.artifacts[] | select(.expired | not)] | length')
            if [[ $held == 0 ]]; then
              builds+=("$(jq -cn --arg app "$app" --arg artifact "$artifact" --arg fingerprint "$fingerprint" '{$app, $artifact, $fingerprint}')")
              echo "- $app builds $artifact" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          echo "apps=$(jq -sc . <<< "${builds[*]}")" >> "$GITHUB_OUTPUT"

      # The runtime version is the native fingerprint, so a phone takes an update only on a build with the same native code.
      # Each export gets its own directory: Expo empties its output first, and `dist` holds the probed server.
      - name: Publish each iPhone app's EAS Update
        if: github.event_name == 'push'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          message=$(git log -1 --format=%s)
          for app in opm stash trips; do
            (cd "apps/$app" && eas update --channel production --environment production --platform ios --non-interactive --input-dir "$RUNNER_TEMP/update-$app" --message="$message")
          done

      # The fingerprint is the hash of the tarball packed before the version bump, which packs the same bytes each time, so an unchanged package and a retry's published one both skip.
      # An app bundles everything, so its manifest drops dependencies, scripts and the Expo entry; the standards CLI bundles its version, so it builds again after the bump.
      - name: Publish changed packages
        if: github.event_name == 'push'
        run: |
          for package in tools/coding-standards apps/{auth,deploy,gateway,opm,portfolio,scope,stash,trips}; do
            cd "$GITHUB_WORKSPACE/$package"
            if [[ $package == apps/* ]]; then npm pkg delete dependencies devDependencies scripts main; fi
            pack=$(mktemp -d)
            vp pm pack --pack-destination "$pack" > /dev/null
            fingerprint=$(sha256sum "$pack"/*.tgz | cut -c1-64)
            name=$(jq -r .name package.json)
            published=$(npm view "$name" fingerprint)
            if [[ $published == "$fingerprint" ]]; then
              echo "- $name unchanged" >> "$GITHUB_STEP_SUMMARY"
              continue
            fi
            npm pkg set "version=0.1.$GITHUB_RUN_NUMBER" "fingerprint=$fingerprint"
            if [[ $package == tools/* ]]; then vp run build; fi
            pack=$(mktemp -d)
            vp pm pack --pack-destination "$pack" > /dev/null
            npm publish --loglevel=warn "$pack"/*.tgz
            echo "- $name 0.1.$GITHUB_RUN_NUMBER" >> "$GITHUB_STEP_SUMMARY"
          done

      # A run holding an unexpired artifact stays: an App Store receipt keeps the next release from uploading its fingerprint again, a Simulator build keeps a Mac from building it again.
      # At most 300 runs a release, well inside the job token's 1,000 requests an hour; later releases take the rest.
      - name: Delete old runs
        if: github.event_name == 'push'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cutoff=$(date -u -d '14 days ago' +%Y-%m-%dT%H:%M:%SZ)
          kept=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" --jq '.artifacts[] | select(.expired | not) | .workflow_run.id' | sort -u)
          runs=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs?created=%3C$cutoff&status=completed&per_page=100" --jq '.workflow_runs[].id' | sort -u)
          old=$(comm -23 <(printf '%s\n' "$runs") <(printf '%s\n' "$kept") | awk 'NF && n++ < 300')
          xargs -r -P 8 -I{} gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/runs/{}" --silent <<< "$old"
          echo "- Deleted $(grep -c . <<< "$old" || true) workflow runs from before $cutoff" >> "$GITHUB_STEP_SUMMARY"

  app-store:
    name: App Store ${{ matrix.app }}
    needs: verify
    if: github.event_name == 'push' && needs.verify.outputs.app-store != '[]'
    concurrency: ios-${{ matrix.app }}
    # One app's failed build leaves the other apps to ship.
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.verify.outputs.app-store) }}
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      EAS_BUILD_DISABLE_EXPO_DOCTOR_STEP: 1
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Build the App Store app
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas build --local --profile production --platform ios --non-interactive --output "$RUNNER_TEMP/app.ipa"
      - name: Upload to the App Store
        id: upload
        env:
          APP: ${{ matrix.app }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          FINGERPRINT: ${{ matrix.fingerprint }}
        run: |
          jq -n --arg app "$APP" --arg build "$GITHUB_RUN_NUMBER" --arg fingerprint "$FINGERPRINT" --arg commit "$GITHUB_SHA" \
            '{app: $app, version: "0.1.\($build)", build: $build, fingerprint: $fingerprint, commit: $commit}' > "$RUNNER_TEMP/receipt.json"
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          printf '%s\n' "$ASC_KEY_P8" > "$HOME/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8"
          xcrun altool --upload-package "$RUNNER_TEMP/app.ipa" --api-key "$ASC_KEY_ID" --api-issuer "$ASC_ISSUER_ID"
          echo "- $APP uploaded to TestFlight" >> "$GITHUB_STEP_SUMMARY"
      # Recorded right after Apple accepts, even when the run is cancelled: the receipt, while it has not expired, is what keeps the next release from uploading this fingerprint again. A run that fails or dies between the two steps, or whose receipt upload fails, leaves none.
      - name: Record Apple's acceptance
        if: always() && steps.upload.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ runner.temp }}/receipt.json
          retention-days: 80
