name: Build and Deploy

on: [push]

# A newer push to a branch stops its older run. Each main commit gets its own group, so every release runs; one shared
# group would replace a waiting main run with the next one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Vite+
        uses: voidzero-dev/setup-vp@v1
        with: {node-version: '26', cache: true, run-install: true}

      - name: Check
        run: vp run check

      - name: Test
        run: vp run test

      - name: Docker Login
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Version
        if: github.ref == 'refs/heads/main'
        env:
          RELEASE_NUMBER: ${{ github.run_number }}
        run: |
          for package in coding-standards media; do
            vp -C tools/$package pm version "0.1.$RELEASE_NUMBER" -- --no-git-tag-version --no-git-checks
          done

      - name: Build
        if: github.ref == 'refs/heads/main'
        env:
          VITE_OTEL_URL: https://otel.mp281x.xyz
        run: vp run build

      - name: Docker
        if: github.ref == 'refs/heads/main'
        run: |
          image_prefix=$(echo "ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]')

          for app in portfolio; do
            docker build ./apps/$app --tag $image_prefix-$app:latest
            docker push $image_prefix-$app:latest
          done

      - name: Publish
        if: github.ref == 'refs/heads/main'
        # pnpm applies publishConfig while packing; npm uploads the README metadata that pnpm 11 omits.
        run: |
          for package in coding-standards media; do
            vp -C tools/$package pm pack --pack-destination "$RUNNER_TEMP/$package"
            npm publish "$RUNNER_TEMP/$package"/*.tgz
          done
