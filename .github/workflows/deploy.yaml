name: Release

# The file keeps its name: npm trusts `deploy.yaml` to publish @deslop/coding-standards.
on:
  push:
    branches: [main]

# A newer push replaces the older run; each release ships everything since the last one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    uses: ./.github/workflows/verify.yaml

  publish:
    name: Images and package
    needs: verify
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - name: Build
        env:
          VITE_OTEL_URL: https://otel.mp281x.xyz
        run: |
          vp -C tools/coding-standards pm version "0.1.${{ github.run_number }}" -- --no-git-tag-version --no-git-checks
          vp run build

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Each image reuses the unchanged layers of the last one, such as Stash's ffmpeg and ONNX Runtime.
      - name: Images
        run: |
          for app in auth gateway portfolio scope stash opm trips signal; do
            image="ghcr.io/${GITHUB_REPOSITORY,,}-$app"
            docker build "apps/$app" --cache-from "$image:latest" --build-arg BUILDKIT_INLINE_CACHE=1 --tag "$image:latest" --tag "$image:$GITHUB_SHA"
            docker push --all-tags "$image"
          done

      # pnpm applies publishConfig while packing; npm uploads the README metadata that pnpm omits.
      - name: Package
        run: |
          vp -C tools/coding-standards pm pack --pack-destination "$RUNNER_TEMP/package"
          npm publish "$RUNNER_TEMP"/package/*.tgz

  app:
    name: App
    needs: verify
    # One app's failed release leaves the others to ship.
    strategy:
      fail-fast: false
      matrix:
        app: [stash, opm, trips]
    uses: ./.github/workflows/release-app.yaml
    with:
      app: ${{ matrix.app }}
    secrets: inherit
