name: Release

# The file keeps its name: npm trusts `deploy.yaml` to publish @deslop/coding-standards.
on:
  push:
    branches: [main]

# A newer push replaces the older run; each release ships everything since the last one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    uses: ./.github/workflows/verify.yaml

  publish:
    name: Packages
    needs: verify
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with: {tasks: 'true'}

      # An app's bundle carries no version, so its build replays from the task cache until its code changes.
      - name: Build every package
        run: |
          vp -C tools/coding-standards pm version "0.1.${{ github.run_number }}" -- --no-git-tag-version --no-git-checks
          vp run build

      # pnpm applies publishConfig while packing; npm uploads the README metadata that pnpm omits.
      - name: Publish @deslop/coding-standards
        run: |
          vp -C tools/coding-standards pm pack --pack-destination "$RUNNER_TEMP/package"
          npm publish --loglevel=warn "$RUNNER_TEMP"/package/*.tgz
          echo "- @deslop/coding-standards 0.1.${{ github.run_number }}" >> "$GITHUB_STEP_SUMMARY"

      # An app publishes its own folder only when its fingerprint, a hash of what it ships, differs from its latest release's; the version moves after the build. Everything is bundled, so the published manifest drops every dependency, the scripts and the Expo entry.
      - name: Publish changed apps
        run: |
          for app in auth deploy gateway portfolio scope stash opm trips signal; do
            cd "apps/$app"
            fingerprint=$({ find dist bin README.md -type f 2>/dev/null | LC_ALL=C sort | xargs sha256sum; jq -S 'del(.version)' package.json; } | sha256sum | cut -c1-64)
            if ! npm view "@deslop/$app" version >/dev/null 2>&1; then
              echo "::warning::@deslop/$app needs its first publish and trusted-publisher setup; see RELEASING.md"
            elif [ "$(npm view "@deslop/$app" fingerprint)" != "$fingerprint" ]; then
              npm pkg set "version=0.1.${{ github.run_number }}" "fingerprint=$fingerprint"
              npm pkg delete dependencies devDependencies scripts main
              npm publish --loglevel=warn
              echo "- @deslop/$app 0.1.${{ github.run_number }}" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "- @deslop/$app unchanged" >> "$GITHUB_STEP_SUMMARY"
            fi
            cd ../..
          done

  app:
    name: App
    needs: verify
    # One app's failed release leaves the others to ship.
    strategy:
      fail-fast: false
      matrix:
        app: [stash, opm, trips]
    uses: ./.github/workflows/release-app.yaml
    with:
      app: ${{ matrix.app }}
    secrets: inherit
