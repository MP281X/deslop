name: Release

# The file keeps its name: npm trusts `deploy.yaml` to publish @deslop/coding-standards.
on:
  push:
    branches: [main]

# A newer push replaces the older run; each release ships everything since the last one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# bash -eo pipefail: a failed command inside a pipeline or an assignment fails its step.
defaults:
  run:
    shell: bash

jobs:
  tree:
    name: Previously verified tree
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      verified: ${{ steps.proof.outputs.verified }}
    steps:
      - uses: actions/checkout@v7
      # GitHub's run record is the proof, not a PR-writable artifact, cache or named check.
      # A missing/failed lookup leaves the output unset and runs Verify normally.
      - name: Is this tree already verified?
        id: proof
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pulls=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls")
          head=$(jq -r --arg repo "$GITHUB_REPOSITORY" --arg sha "$GITHUB_SHA" '
            [.[] | select(.merged_at != null and .merge_commit_sha == $sha
              and .base.ref == "main" and .base.repo.full_name == $repo and .head.repo.full_name == $repo)]
            | if length == 1 then .[0].head.sha else empty end' <<< "$pulls")
          [[ -n $head ]] || exit 0

          git fetch --no-tags --depth=1 origin "$head"
          tree=$(git rev-parse 'HEAD^{tree}')
          [[ $tree == "$(git rev-parse "$head^{tree}")" ]] || exit 0

          runs=$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/workflows/verify.yaml/runs?head_sha=$head&event=push&status=success&per_page=100")
          run=$(jq -r --arg repo "$GITHUB_REPOSITORY" --arg head "$head" '
            [.[] | .workflow_runs[] | select(.head_sha == $head and .event == "push"
              and .status == "completed" and .conclusion == "success"
              and .path == ".github/workflows/verify.yaml"
              and .repository.full_name == $repo and .head_repository.full_name == $repo)]
            | first | .id // empty' <<< "$runs")
          [[ -n $run ]] || exit 0
          echo "- Tree $tree already passed [Verify]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$run)." >> "$GITHUB_STEP_SUMMARY"
          echo "verified=true" >> "$GITHUB_OUTPUT"

  verify:
    name: Verify
    needs: tree
    if: ${{ !cancelled() && needs.tree.outputs.verified != 'true' }}
    uses: ./.github/workflows/verify.yaml

  verified:
    name: Verified
    needs: [tree, verify]
    if: ${{ !cancelled() && (needs.tree.outputs.verified == 'true' || needs.verify.result == 'success') }}
    runs-on: ubuntu-26.04
    outputs:
      mobile: ${{ steps.apps.outputs.mobile }}
    steps:
      - uses: actions/checkout@v7
      - name: Discover mobile apps
        id: apps
        run: |
          shopt -s nullglob
          apps=(apps/*/app.config.ts)
          apps=("${apps[@]%/app.config.ts}")
          apps=("${apps[@]#apps/}")
          mobile=$(printf '%s\n' "${apps[@]}" | jq -Rsc 'split("\n") | map(select(length > 0))')
          echo "mobile=$mobile" >> "$GITHUB_OUTPUT"

  publish:
    name: Packages
    needs: verified
    if: ${{ !cancelled() && needs.verified.result == 'success' }}
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with: {tasks: 'true'}

      # An app's bundle carries no version, so its build replays from the task cache until its code changes.
      - name: Build every package
        run: |
          vp run build

      # pnpm applies publishConfig while packing; npm uploads the README metadata that pnpm omits.
      - name: Publish @deslop/coding-standards
        run: |
          vp -C tools/coding-standards pm version "0.1.${{ github.run_number }}" -- --no-git-tag-version --no-git-checks
          vp -C tools/coding-standards pm pack --pack-destination "$RUNNER_TEMP/package"
          npm publish --loglevel=warn "$RUNNER_TEMP"/package/*.tgz
          echo "- @deslop/coding-standards 0.1.${{ github.run_number }}" >> "$GITHUB_STEP_SUMMARY"

      # An app publishes only when its shipped fingerprint changes; everything is bundled, so its published manifest drops dependencies, scripts and the Expo entry.
      - name: Publish changed apps
        run: |
          shopt -s nullglob
          apps=(apps/*/package.json)
          apps=("${apps[@]%/package.json}")
          apps=("${apps[@]#apps/}")
          publish() {
            cd "apps/$1"
            # find fails on an app without bin/ after listing what exists.
            fingerprint=$({ { find dist bin README.md -type f 2>/dev/null || true; } | LC_ALL=C sort | xargs sha256sum; jq -S 'del(.version)' package.json; } | sha256sum | cut -c1-64)
            if ! published=$(npm view "@deslop/$1" fingerprint 2> "$RUNNER_TEMP/view-$1"); then
              # Only a missing package is a first publish; any other failure, such as the registry being down, fails the app.
              grep -q E404 "$RUNNER_TEMP/view-$1" || { cat "$RUNNER_TEMP/view-$1" >&2; return 1; }
              echo "::warning::@deslop/$1 needs its first publish and trusted-publisher setup; see .github/releasing.md"
              echo "- @deslop/$1 unpublished" > "$RUNNER_TEMP/summary-$1"
            elif [ "$published" != "$fingerprint" ]; then
              npm pkg set "version=0.1.${{ github.run_number }}" "fingerprint=$fingerprint"
              npm pkg delete dependencies devDependencies scripts main
              npm publish --loglevel=warn
              echo "- @deslop/$1 0.1.${{ github.run_number }}" > "$RUNNER_TEMP/summary-$1"
            else
              echo "- @deslop/$1 unchanged" > "$RUNNER_TEMP/summary-$1"
            fi
          }
          pids=()
          for app in "${apps[@]}"; do publish "$app" & pids+=($!); done
          failed=0
          for pid in "${pids[@]}"; do wait "$pid" || failed=1; done
          for app in "${apps[@]}"; do cat "$RUNNER_TEMP/summary-$app" 2>/dev/null >> "$GITHUB_STEP_SUMMARY" || echo "- @deslop/$app failed" >> "$GITHUB_STEP_SUMMARY"; done
          exit "$failed"

  app:
    name: App
    needs: verified
    if: ${{ !cancelled() && needs.verified.result == 'success' && needs.verified.outputs.mobile != '[]' }}
    permissions:
      contents: read
      actions: read
    # One app's failed release leaves the others to ship.
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.verified.outputs.mobile) }}
    uses: ./.github/workflows/release-app.yaml
    with:
      app: ${{ matrix.app }}
    secrets: inherit
