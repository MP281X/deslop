name: App Store signing

# Set up a new iPhone app, its App Store record's TestFlight group included, or replace App Store profiles missing an entitlement: `.github/releasing.md`.
# The one place this repository drives an interactive tool. eas-cli registers a new app's identifiers and gives it the team's certificate only
# interactively; its non-interactive mode stops at the missing certificate. Expect answers the two prompts a new app gets and fails on any other.
on:
  workflow_dispatch:
    inputs:
      app:
        description: The app's folder in apps/
        required: true

# bash -eo pipefail: a failed command inside a pipeline or an assignment fails its step.
defaults:
  run:
    shell: bash

env:
  APP_VARIANT: production
  DESLOP_DOMAIN: ${{ vars.DESLOP_DOMAIN }}

jobs:
  # A name that is no app stops here, before the signing job builds a path from it.
  app:
    name: App
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/mobile-apps
        with:
          app: ${{ inputs.app }}

  signing:
    name: Signing
    needs: app
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/${{ inputs.app }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with: {eas: 'true'}
      - uses: ./.github/actions/app-store-connect
        with:
          key-id: ${{ secrets.ASC_KEY_ID }}
          issuer-id: ${{ secrets.ASC_ISSUER_ID }}
          key: ${{ secrets.ASC_KEY_P8 }}

      - name: Inspect App Store profiles and delete stale ones
        id: profiles
        run: |
          vp exec expo config --type introspect --json > "$RUNNER_TEMP/signing-config.json"
          python3 ../../.github/scripts/app-store-profiles.py prepare "$RUNNER_TEMP/signing-config.json"

      - name: Set up signing
        if: steps.profiles.outputs.sign == '1'
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          # A refresh only changes profiles, not the capabilities of the existing App IDs.
          EXPO_NO_CAPABILITY_SYNC: ${{ steps.profiles.outputs.refresh }}
          EXPO_APPLE_TEAM_ID: 99K7MQUK7F
          EXPO_APPLE_TEAM_TYPE: INDIVIDUAL
          EXPO_ASC_API_KEY_PATH: ${{ runner.temp }}/asc.p8
          EXPO_ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          EXPO_ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          # Plain prompts: each starts with "?" after the line reset, which nothing else prints; a coloured one counts as unexpected.
          NODE_DISABLE_COLORS: 1
        run: |
          printf '%s\n' "$ASC_KEY_P8" > "$EXPO_ASC_API_KEY_PATH"
          sudo apt-get update --quiet > /dev/null && sudo apt-get install --yes --quiet --no-install-recommends expect > /dev/null
          # shellcheck disable=SC2016 # $expect_out is expect's
          expect -c '
            set timeout 600
            spawn eas credentials:configure-build --platform ios --profile production
            expect {
              -re {\x1b\[1G\? Reuse this distribution certificate\?} { send "\r"; exp_continue }
              -re {\x1b\[1G\? Generate a new Apple Provisioning Profile\?} { send "\r"; exp_continue }
              -re {\x1b\[1G(?:\x1b\[36m)?\?(?:\x1b\[39m)? ([^\r\n]*)} { puts "\n::error::Unexpected prompt: $expect_out(1,string)"; exit 1 }
              timeout { puts "\n::error::No prompt and no exit in ten minutes"; exit 1 }
              eof
            }
            exit [lindex [wait] 3]
          '

      - name: Verify new App Store profiles
        if: steps.profiles.outputs.sign == '1'
        run: python3 ../../.github/scripts/app-store-profiles.py verify "$RUNNER_TEMP/signing-config.json"

      # Only the App Store Connect website creates an app record, which needs the bundle ID signing registered, so a new app's first run stops here; a new record gets an internal TestFlight group with the testers of the team's other internal groups.
      - name: Find the App Store app and its TestFlight group
        run: |
          api() { curl --fail-with-body --silent --show-error --globoff --header "Authorization: Bearer $ASC_TOKEN" --header 'Content-Type: application/json' "https://api.appstoreconnect.apple.com/v1/$1" "${@:2}"; }
          bundle=$(jq -r .ios.bundleIdentifier "$RUNNER_TEMP/signing-config.json")
          app=$(api "apps?filter[bundleId]=$bundle" | jq -r --arg bundle "$bundle" '.data[] | select(.attributes.bundleId == $bundle) | .id')
          if [[ -z $app ]]; then
            echo "::error::No App Store Connect app has the bundle ID $bundle. Create it at https://appstoreconnect.apple.com/apps (+, New App, iOS, bundle ID $bundle), then run this workflow again."
            exit 1
          fi
          groups=$(api "betaGroups?filter[app]=$app&filter[isInternalGroup]=true" | jq '.data | length')
          if [[ $groups == 0 ]]; then
            testers=$(api 'betaGroups?filter[isInternalGroup]=true&include=betaTesters&limit=200' | jq -c '[.included[]? | select(.type == "betaTesters") | {type, id}] | unique')
            api betaGroups --data "$(jq -cn --arg app "$app" --argjson testers "$testers" '{data: {type: "betaGroups", attributes: {name: "Internal", isInternalGroup: true, hasAccessToAllBuilds: true}, relationships: {app: {data: {type: "apps", id: $app}}, betaTesters: {data: $testers}}}}')" > /dev/null
            echo "- Created the internal TestFlight group of $bundle" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "- $bundle: https://appstoreconnect.apple.com/apps/$app/testflight/ios" >> "$GITHUB_STEP_SUMMARY"
