name: App Store signing

# Set up a new iPhone app or replace App Store profiles missing an entitlement: `.github/releasing.md`.
# The one place this repository drives an interactive tool. eas-cli registers a new app's identifiers and gives it the team's certificate only
# interactively; its non-interactive mode stops at the missing certificate. Expect answers the two prompts a new app gets and fails on any other.
on:
  workflow_dispatch:
    inputs:
      app:
        description: The app's folder in apps/
        required: true

permissions:
  contents: read

# bash -eo pipefail: a failed command inside a pipeline or an assignment fails its step.
defaults:
  run:
    shell: bash

env:
  APP_VARIANT: production
  DESLOP_DOMAIN: ${{ vars.DESLOP_DOMAIN }}
  EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

jobs:
  signing:
    name: Signing
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/${{ inputs.app }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with: {eas: 'true'}
      - uses: ./.github/actions/app-store-connect
        with:
          key-id: ${{ secrets.ASC_KEY_ID }}
          issuer-id: ${{ secrets.ASC_ISSUER_ID }}
          key: ${{ secrets.ASC_KEY_P8 }}

      - name: Inspect App Store profiles and delete stale ones
        id: profiles
        run: |
          vp exec expo config --type introspect --json > "$RUNNER_TEMP/signing-config.json"
          cat > "$RUNNER_TEMP/signing-profiles.py" <<'PY'
          import base64
          import json
          import os
          import plistlib
          import subprocess
          import sys
          from pathlib import Path
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen

          api = "https://api.appstoreconnect.apple.com/v1"
          temp = Path(os.environ["RUNNER_TEMP"])

          def request(url, method="GET"):
              if not url.startswith(f"{api}/"):
                  raise ValueError(f"Unexpected App Store Connect URL: {url}")
              return urlopen(Request(url, headers={"Authorization": f'Bearer {os.environ["ASC_TOKEN"]}'}, method=method))

          def records(path):
              url = f"{api}/{path}"
              while url:
                  with request(url) as response:
                      page = json.load(response)
                  yield from page["data"]
                  url = page["links"].get("next")

          def entitlements(profile):
              plist = subprocess.run(
                  ["openssl", "cms", "-verify", "-inform", "DER", "-noverify"],
                  input=base64.b64decode(profile["attributes"]["profileContent"], validate=True),
                  stdout=subprocess.PIPE, check=True,
              ).stdout
              return plistlib.loads(plist)["Entitlements"]

          def fail(message):
              sys.exit(f"::error::{message}")

          config = json.loads((temp / "signing-config.json").read_text())
          main = config["ios"]["bundleIdentifier"]
          targets = {main: config["_internal"]["modResults"]["ios"]["entitlements"]}
          for extension in config["extra"]["eas"].get("build", {}).get("experimental", {}).get("ios", {}).get("appExtensions", []):
              targets[extension["bundleIdentifier"]] = extension.get("entitlements") or {}

          query = urlencode({"filter[identifier]": ",".join(targets), "limit": 200})
          profiles = {identifier: [] for identifier in targets}
          for bundle in records(f"bundleIds?{query}"):
              identifier = bundle["attributes"]["identifier"]
              for profile in records(f'bundleIds/{bundle["id"]}/profiles?limit=200'):
                  if profile["attributes"]["profileType"] == "IOS_APP_STORE":
                      profiles[identifier].append(profile)

          # Compare keys, not values: profiles can authorize wildcards, and distribution uses a different aps-environment.
          def missing(identifier, profile):
              return sorted(targets[identifier].keys() - entitlements(profile).keys())

          snapshot = temp / "signing-profile-ids.json"
          if sys.argv[1] == "verify":
              before = json.loads(snapshot.read_text())
              for identifier, existing in profiles.items():
                  if not existing:
                      fail(f"No App Store profile for {identifier} after setup")
                  created = [profile for profile in existing if profile["id"] not in before[identifier]]
                  for profile in created:
                      absent = missing(identifier, profile)
                      print(f'Created {identifier}: {profile["attributes"]["name"]} ({profile["id"]})')
                      if absent:
                          fail(f'New profile for {identifier} lacks {", ".join(absent)}')
                      print(f'{identifier}: all declared entitlements present ({", ".join(sorted(targets[identifier]))})')
              sys.exit(0)

          signed = [identifier for identifier, existing in profiles.items() if existing]
          unsigned = [identifier for identifier, existing in profiles.items() if not existing]
          if signed and unsigned:
              fail(f'Partly signed: App Store profiles for {", ".join(signed)}, none for {", ".join(unsigned)}. Delete the App Store profiles of {", ".join(signed)} at https://developer.apple.com/account/resources/profiles/list, then run this workflow again.')

          stale = []
          for identifier, existing in profiles.items():
              for profile in existing:
                  absent = missing(identifier, profile)
                  if absent:
                      stale.append((identifier, profile, absent))
          if signed and not stale:
              fail(f'Already signed for the App Store: {", ".join(signed)}. Releases build with that signing; there is nothing to set up.')

          snapshot.write_text(json.dumps({identifier: [p["id"] for p in existing] for identifier, existing in profiles.items()}))
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print(f"refresh={int(bool(stale))}", file=output)
          for identifier, profile, absent in stale:
              with request(f'{api}/profiles/{profile["id"]}', "DELETE"):
                  print(f'Deleted {identifier}: {profile["attributes"]["name"]} ({profile["id"]}); missing {", ".join(absent)}')
          PY
          python3 "$RUNNER_TEMP/signing-profiles.py" prepare

      - name: Set up signing
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          # A refresh only changes profiles, not the capabilities of the existing App IDs.
          EXPO_NO_CAPABILITY_SYNC: ${{ steps.profiles.outputs.refresh }}
          EXPO_APPLE_TEAM_ID: 99K7MQUK7F
          EXPO_APPLE_TEAM_TYPE: INDIVIDUAL
          EXPO_ASC_API_KEY_PATH: ${{ runner.temp }}/asc.p8
          EXPO_ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          EXPO_ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          # Plain prompts: each starts with "?" after the line reset, which nothing else prints; a coloured one counts as unexpected.
          NODE_DISABLE_COLORS: 1
        run: |
          (umask 077 && printf '%s\n' "$ASC_KEY_P8" > "$EXPO_ASC_API_KEY_PATH")
          sudo apt-get update --quiet > /dev/null && sudo apt-get install --yes --quiet --no-install-recommends expect > /dev/null
          # shellcheck disable=SC2016 # $expect_out is expect's
          expect -c '
            set timeout 600
            spawn eas credentials:configure-build --platform ios --profile production
            expect {
              -re {\x1b\[1G\? Reuse this distribution certificate\?} { send "\r"; exp_continue }
              -re {\x1b\[1G\? Generate a new Apple Provisioning Profile\?} { send "\r"; exp_continue }
              -re {\x1b\[1G(?:\x1b\[36m)?\?(?:\x1b\[39m)? ([^\r\n]*)} { puts "\n::error::Unexpected prompt: $expect_out(1,string)"; exit 1 }
              timeout { puts "\n::error::No prompt and no exit in ten minutes"; exit 1 }
              eof
            }
            exit [lindex [wait] 3]
          '

      - name: Verify new App Store profiles
        run: python3 "$RUNNER_TEMP/signing-profiles.py" verify
