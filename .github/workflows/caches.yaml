name: Caches

# A merged branch is deleted and a closed pull request's merge ref stops running, but their caches, which only that ref could read, count against the repository's 10 GB until they age out.
# `pull_request_target` runs from the base's workflow even when the pull request has a merge conflict, and checks out nothing.
on:
  delete:
  pull_request_target:
    types: [closed]

permissions:
  actions: write

jobs:
  delete:
    name: Delete the ref's caches
    if: github.event_name == 'pull_request_target' || github.event.ref_type == 'branch'
    runs-on: ubuntu-26.04
    steps:
      - name: Delete the ref's caches
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REF: ${{ github.event_name == 'pull_request_target' && format('refs/pull/{0}/merge', github.event.pull_request.number) || format('refs/heads/{0}', github.event.ref) }}
        run: gh cache delete --all --succeed-on-no-caches --ref "$REF"
