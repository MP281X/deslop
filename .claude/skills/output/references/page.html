<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Output</title>
		<style>
			:root {
				--ink: var(--foreground, #f4f4f5);
				--muted: var(--muted-foreground, #a1a1aa);
				--line: var(--border, #27272a);
				--accent: var(--accent, #7aa2f7);
				--ok: var(--success, #73daca);
				--bad: var(--destructive, #f7768e);
				--warn: var(--warning, #e0af68);
				--font: var(--font-sans, 'JetBrains Mono', ui-monospace, monospace);
			}
			* {
				box-sizing: border-box;
			}
			html,
			body {
				margin: 0;
				background: transparent;
				color: var(--ink);
				font-family: var(--font);
			}
			body {
				padding: 24px;
			}
			main {
				max-width: 720px;
				margin: 0 auto;
				display: grid;
				gap: 24px;
			}
			h1 {
				margin: 0;
				font-size: clamp(24px, 5vw, 36px);
				line-height: 1.15;
				font-weight: 600;
				letter-spacing: -0.02em;
			}
			.lede {
				margin: 0;
				color: var(--muted);
				font-size: 15px;
				line-height: 1.45;
				max-width: 60ch;
			}
			.token {
				color: var(--accent);
				font-weight: 600;
			}
			.rule {
				height: 1px;
				background: var(--line);
			}
			table {
				width: 100%;
				border-collapse: collapse;
				font-size: 14px;
			}
			th,
			td {
				text-align: left;
				padding: 10px 0;
				border-bottom: 1px solid var(--line);
				vertical-align: top;
			}
			th {
				color: var(--muted);
				font-weight: 500;
			}
			td.num,
			th.num {
				text-align: right;
				font-variant-numeric: tabular-nums;
			}
			.flow {
				display: grid;
				grid-template-columns: 1fr auto 1fr auto 1fr;
				align-items: center;
				gap: 12px;
			}
			.node {
				border: 1px solid var(--line);
				padding: 12px;
				min-height: 44px;
				display: grid;
				align-content: center;
				gap: 4px;
			}
			.node strong {
				font-weight: 600;
				font-size: 14px;
			}
			.node span {
				color: var(--muted);
				font-size: 12px;
			}
			.arrow {
				color: var(--muted);
				font-size: 12px;
				text-align: center;
			}
			.ask {
				margin: 0;
				font-size: 15px;
			}
			.ask strong {
				color: var(--accent);
			}
			@media (max-width: 560px) {
				body {
					padding: 16px;
				}
				.flow {
					grid-template-columns: 1fr;
				}
				.arrow {
					text-align: left;
					padding-left: 12px;
				}
			}
		</style>
	</head>
	<body>
		<main>
			<h1 data-slot="result">One line: the outcome or the decision.</h1>
			<p class="lede" data-slot="lede">One sentence that names the mechanism, not the process.</p>

			<section data-slot="visual" aria-label="The one visual">
				<!-- Replace this flow with the one diagram, mock, chart or table that carries the idea. -->
				<div class="flow">
					<div class="node"><strong>Who</strong><span>Group "Sales team"</span></div>
					<div class="arrow">View + Use →</div>
					<div class="node"><strong>Space "Sales"</strong><span>Workflow "Lead intake"</span></div>
					<div class="arrow">limit: View →</div>
					<div class="node"><strong>Maya gets</strong><span>View, Use, Edit</span></div>
				</div>
			</section>

			<table data-slot="facts">
				<thead>
					<tr>
						<th>Fact</th>
						<th class="num">Value</th>
					</tr>
				</thead>
				<tbody>
					<tr>
						<td>One fact</td>
						<td class="num">one value</td>
					</tr>
				</tbody>
			</table>

			<p class="ask" data-slot="ask"><strong>Ask:</strong> the one decision, or delete this line.</p>
		</main>
	</body>
</html>
