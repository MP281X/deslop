<!doctype html>
<!--
  Proof video template for HyperFrames. Copy it to a scratch project as index.html.
  Edit only the marked parts: the app tokens, one .shot and one necessary .cap per chapter, and the CHAPTERS list.
  Recordings are T3 MP4s at 1280x800, placed in assets/. Targets are fractions of the recorded viewport.
-->
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=1280, height=800" />
		<title>Proof video</title>
		<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
		<style>
			/* EDIT: the app's own font file, copied into assets/, and its tokens. */
			@font-face {
				font-family: 'App';
				src: url('assets/app-font.woff2') format('woff2');
				font-weight: 100 900;
			}
			:root {
				--canvas: #f1f2f4; /* a step darker than the app's page surface */
				--surface: #ffffff; /* the app's page surface */
				--text: #0f172a; /* the app's foreground */
				--primary: #2b59e8; /* the app's primary */
				--radius: 12px; /* the app's base radius, plus 2 px */
			}

			body {
				margin: 0;
				background: var(--canvas);
				font-family: 'App', sans-serif;
				color: var(--text);
			}
			#root {
				position: relative;
				width: 100%;
				height: 100%;
				overflow: hidden;
				background: var(--canvas);
			}

			#stage {
				position: absolute;
				left: 80px;
				top: 24px;
				width: 1120px;
				height: 700px;
				border-radius: var(--radius);
				overflow: hidden;
				background: var(--surface);
				box-shadow:
					0 1px 2px rgba(15, 23, 42, 0.08),
					0 18px 48px rgba(15, 23, 42, 0.16);
			}
			.shot {
				position: absolute;
				inset: 0;
			}
			.zoom-outer {
				position: absolute;
				inset: 0;
				transform-origin: 50% 50%;
			}
			.zoom-inner {
				position: absolute;
				inset: 0;
			}
			.tap {
				position: absolute;
				width: 44px;
				height: 44px;
				margin: -22px 0 0 -22px;
				border-radius: 50%;
				border: 3px solid var(--primary);
				background: color-mix(in oklch, var(--primary) 18%, transparent);
				opacity: 0;
				z-index: 1;
			}
			video {
				position: absolute;
				left: 0;
				top: 0;
				width: 1120px;
				height: 700px;
			}

			.cap {
				position: absolute;
				left: 80px;
				top: 744px;
				font-size: 44px;
				font-weight: 500;
			}
		</style>
	</head>
	<body>
		<!-- EDIT: data-duration is the last chapter's end. -->
		<div id="root" data-composition-id="main" data-start="0" data-width="1280" data-height="800" data-duration="19.4">
			<div id="stage">
				<!-- EDIT: one .shot per chapter; data-start and data-duration match CHAPTERS, data-media-start trims the recording. -->
				<div class="shot" id="shot1">
					<div class="zoom-outer" id="z1o">
						<div class="zoom-inner" id="z1i">
							<video
								id="v1"
								src="assets/chapter-1.mp4"
								muted
								playsinline
								data-start="0"
								data-duration="7.4"
								data-media-start="0"
								data-track-index="0"
							></video>
						</div>
					</div>
				</div>
				<div class="shot" id="shot2">
					<div class="zoom-outer" id="z2o">
						<div class="zoom-inner" id="z2i">
							<video
								id="v2"
								src="assets/chapter-2.mp4"
								muted
								playsinline
								data-start="7"
								data-duration="12.4"
								data-media-start="0"
								data-track-index="1"
							></video>
						</div>
					</div>
				</div>
			</div>

			<!-- EDIT: captions add only meaning the recording does not already show, under twelve words. -->
			<div class="cap" id="cap1">Choose a file and start the import</div>
			<div class="cap" id="cap2">The completed records remain after stopping</div>
		</div>
		<script>
			// EDIT: one entry per chapter. start and end are composition seconds. Each move is one input
			// or outcome: at is the composition second it happens, target the element's center as
			// viewport fractions, zoom 1 for no push and at most 1.8, tap true for a click or a tap.
			const CHAPTERS = [
				{
					start: 0,
					end: 7.4,
					moves: [
						{at: 1.6, target: [0.5, 0.47], zoom: 1.45, tap: true},
						{at: 4.8, target: [0.66, 0.72], zoom: 1.6, tap: true}
					]
				},
				{start: 7.0, end: 19.4, moves: [{at: 8.8, target: [0.5, 0.52], zoom: 1.75, tap: false}]}
			]

			const W = 1120,
				H = 700
			const clamp = (v, lo, hi) => Math.min(Math.max(v, lo), hi)
			const aim = ([fx, fy], s) => {
				const cx = clamp(fx * W, W / (2 * s), W - W / (2 * s))
				const cy = clamp(fy * H, H / (2 * s), H - H / (2 * s))
				return {s, x: -(cx - W / 2), y: -(cy - H / 2)}
			}
			const ease = 'power3.inOut'
			const tl = gsap.timeline({paused: true})

			CHAPTERS.forEach((chapter, index) => {
				const n = index + 1
				const last = n === CHAPTERS.length
				if (index > 0)
					tl.fromTo(`#shot${n}`, {opacity: 0}, {opacity: 1, duration: 0.18, ease: 'power1.inOut'}, chapter.start)
				tl.fromTo(`#cap${n}`, {opacity: 0, y: 14}, {opacity: 1, y: 0, duration: 0.2, ease: 'power2.out'}, chapter.start)
				if (!last)
					tl.to(`#cap${n}`, {opacity: 0, y: -4, duration: 0.18, ease: 'power2.in'}, CHAPTERS[index + 1].start - 0.18)
				// The camera arrives on each target before its input, then the tap ring marks the input.
				chapter.moves.forEach(move => {
					const to = aim(move.target, move.zoom)
					const arrive = Math.max(chapter.start, move.at - 0.4)
					const duration = Math.min(0.32, move.at - arrive)
					tl.to(`#z${n}o`, {scale: to.s, duration, ease}, arrive)
					tl.to(`#z${n}i`, {x: to.x, y: to.y, duration, ease}, arrive)
					if (!move.tap) return
					const ring = document.createElement('div')
					ring.className = 'tap'
					ring.style.left = `${move.target[0] * W}px`
					ring.style.top = `${move.target[1] * H}px`
					document.getElementById('z' + n + 'i').append(ring)
					tl.fromTo(
						ring,
						{scale: 0.5, opacity: 0.9},
						{scale: 1.6, opacity: 0, duration: 0.32, ease: 'power2.out', immediateRender: false},
						move.at
					)
				})
			})

			window.__timelines['main'] = tl
		</script>
	</body>
</html>
