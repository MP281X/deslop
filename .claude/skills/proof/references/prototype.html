/* PROTOTYPE DATA. Copy to scratch, edit only this script, check with html_preview, html_render by path.
   DECISIONS   one section each, numbered from FIRST. `today` and each variant are paths: target ids in click order,
               one marked * where its still is taken: the tap that tells it apart from the others.
               At least three variants, each a different approach. The open variant plays beside Today, only the
               steps where they differ, lined up; the variants sit below as stills to switch.
   variants    letter: {title, parts, path}; title is two or three words for what the frames can't show.
               view() reads parts as has.<word>; Today gets has.today.
   view(s,has) the app's HTML for state s, with the app's real labels and data. k(id, patch, html, class, typed)
               is a click target; an icon-only target names itself with aria-label. Kit as before. */
const FIRST = 6, SIZE = [800, 450], PHONE = [466, 678];
const DECISIONS = [
  { name: 'Rename', task: 'Rename Project to Atlas', start: {},
    today: 'row menu settings *name save',
    variants: { a: { title: 'Edits in place', parts: 'inline', path: 'row *title save' },
                b: { title: 'Then edits in place', parts: 'menu', path: 'row menu *rename save' },
                c: { title: 'From the menu', parts: 'menu dialog', path: 'row menu rename dname *dsave' } } }
];
function view(s, has) {
  const name = s.name || 'Project', done = { name: 'Atlas', edit: 0, dlg: 0, ren: 0, menu: 0 };
  const side = `<div class=side><span class=org><b>A</b>Acme</span><span class="nav on">Projects</span><span class=nav>Members</span></div>`;
  if (!s.open) return `${side}<main>${k('row', { open: 1 }, `<span>${name}</span><span class=m>eu-west</span>`, 'row')}<div class=row><span>Billing</span><span class=m>us-east</span></div><div class=row><span>Website</span><span class=m>eu-west</span></div></main>`;
  const title = s.edit ? k('save', done, name, 'inp', 'Atlas') : has.inline ? k('title', { edit: 1 }, name) : name;
  const menu = has.inline ? '' : k('menu', { menu: 1 }, '<span aria-label="Menu">⋯</span>', 'chip');
  const item = has.menu ? k('rename', has.dialog ? { menu: 0, ren: 1 } : { menu: 0, edit: 1 }, 'Rename', 'it') : k('settings', { menu: 0, dlg: 1 }, 'Settings', 'it');
  const pop = s.menu ? `<div class=pop style="right:16px;top:40px;width:140px">${item}<span class=it>Archive</span></div>` : '';
  const dlg = s.dlg ? `<div class=scrim><div class=dlg><div class=f><span class=m>Name</span>${k('name', { draft: 1 }, s.draft ? 'Atlas' : name, 'inp', 'Atlas')}</div><div class=f><span class=m>Region</span><span class=sel>eu-west</span></div><div class=ft>${k('save', done, 'Save', 'btn')}</div></div></div>` : '';
  const ren = s.ren ? `<div class=scrim><div class=dlg><div class=f><span class=m>Rename project</span>${k('dname', { draft: 1 }, s.draft ? 'Atlas' : name, 'inp', 'Atlas')}</div><div class=ft><span class=m>Cancel</span>${k('dsave', done, 'Rename', 'btn')}</div></div></div>` : '';
  return `${side}<main><div class=row>${title}${menu}</div><div class=row><span class=m>Owner</span>You</div><div class=row><span class=m>Region</span>eu-west</div>${pop}</main>${dlg}${ren}`;
}

</style></head><body><div id="stage"></div><script>
let [AW, AH] = SIZE;
const BEAT = 1300, PRESS = 520, MINW = 280, MINH = 140, PAD = 14, SHOWN = '.pop,.dlg,.sheet';
const CURSOR = '<svg class="cur" viewBox="0 0 13 19"><path d="M1 1v14.2l3.7-3.5 2.5 5.9 2.3-1-2.5-5.8H12z" fill="var(--foreground)" stroke="var(--background)" stroke-width="1.2" stroke-linejoin="round"/></svg>';
const node = (h) => { const t = document.createElement('template'); t.innerHTML = h.trim(); return t.content.firstChild; };
const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;');
const split = (s) => s.trim().split(/\s+/).filter((x) => x && x != '|');
function k(id, patch, html, cls = '', typed) {
  return `<span class="${cls}"${id ? ` data-t="${id}" data-p="${esc(JSON.stringify(patch || {}))}"${typed ? ` data-y="${esc(typed)}"` : ''}` : ''}>${html}</span>`;
}
const box = document.createElement('div');
function trace(path, start, has) {
  const S = [start], T = [];
  let mark = 0;
  for (const tok of split(path)) {
    const id = tok.replace('*', '');
    if (id != tok) mark = T.length;
    box.innerHTML = view(S.at(-1), has);
    const e = box.querySelector(`[data-t="${id}"]`);
    if (!e) { console.error(`no target "${id}" after ${T.length} steps`); break; }
    const y = e.dataset.y;
    const label = y ? `Type “${y}”` : (e.querySelector('[aria-label]')?.ariaLabel || e.ariaLabel || [...e.childNodes].map((n) => n.textContent.trim()).find((x) => x.length > 1) || e.textContent.trim()).slice(0, 28);
    // Two steps are the same only on the same target with the same label: typing into another field is a change.
    T.push({ id, typed: y, label, key: `${id} ${label}` });
    S.push({ ...S.at(-1), ...JSON.parse(e.dataset.p) });
  }
  return { S, T, has, mark };
}
// Steps of b lined up against a: equal steps share a column, a step b takes instead of one of a's shares that
// column, and whatever is left over gets a column of its own.
function align(a, b) {
  const L = Array.from({ length: a.length + 1 }, () => Array(b.length + 1).fill(0));
  for (let i = a.length - 1; i >= 0; i--) for (let j = b.length - 1; j >= 0; j--) L[i][j] = a[i] === b[j] ? L[i + 1][j + 1] + 1 : Math.max(L[i + 1][j], L[i][j + 1]);
  const at = Array(a.length).fill(null), ins = Array.from({ length: a.length + 1 }, () => []);
  let i = 0, j = 0;
  while (i < a.length || j < b.length) {
    if (i < a.length && j < b.length && a[i] === b[j]) { at[i] = { j, op: 'same' }; i++; j++; continue; }
    const dels = [], adds = [];
    while (i < a.length && !(j < b.length && a[i] === b[j]) && (j >= b.length || L[i + 1][j] >= L[i][j + 1])) dels.push(i++);
    while (j < b.length && !(i < a.length && a[i] === b[j]) && (i >= a.length || L[i][j + 1] >= L[i + 1][j])) adds.push(j++);
    if (!dels.length && !adds.length) { if (i < a.length) dels.push(i++); else adds.push(j++); }
    dels.forEach((d, n) => { at[d] = n < adds.length ? { j: adds[n], op: 'add' } : { j: null, op: 'del' }; });
    ins[i].push(...adds.slice(dels.length));
  }
  return { at, ins };
}
// Today and one variant on one timeline: per column, the step each takes, or where it waits. A step both take
// alike shows no difference, so its column is skipped and the next one starts past it.
function pair(today, t) {
  const al = align(today.T.map((s) => s.key), t.T.map((s) => s.key)), cols = [];
  for (let i = 0; i <= today.T.length; i++) {
    for (const j of al.ins[i]) cols.push([null, { j, op: 'add' }]);
    if (i < today.T.length) cols.push([{ j: i, op: 'same' }, al.at[i]]);
  }
  return [today, t].map((v, vi) => {
    let done = 0;
    const at = cols.map((c) => { const st = c[vi]; if (st && st.j != null) { done = st.j + 1; return { i: st.j, act: true, op: st.op }; } return { i: done, act: false }; })
      .filter((_, n) => cols[n][1]?.op != 'same');
    at.push({ i: v.T.length, act: false, end: true });
    return at;
  });
}
// A version cut to the steps from its first to its last difference with the other.
function trim(a, b) {
  const la = a.T.map((s) => s.key), lb = b.T.map((s) => s.key);
  let P = 0; while (P < la.length && P < lb.length && la[P] == lb[P]) P++;
  let E = 0; while (E < la.length - P && E < lb.length - P && la.at(-1 - E) == lb.at(-1 - E)) E++;
  const cut = (v, l) => ({ ...v, S: v.S.slice(P, v.S.length - E), T: v.T.slice(P, l.length - E) });
  return [cut(a, la), cut(b, lb)];
}
const stage = document.getElementById('stage');
const meas = node('<div class="app meas"></div>');
stage.append(meas);
// The part of the app that matters for these states: their taps and any open menu, dialog or sheet.
function region(t, states) {
  const r = { x: AW, y: AH, r: 0, b: 0 };
  Object.assign(meas.style, { width: AW + 'px', height: AH + 'px' });
  for (const [i, ids] of states) {
    meas.innerHTML = view(t.S[i], t.has);
    const o = meas.getBoundingClientRect();
    for (const e of [...ids.map((id) => meas.querySelector(`[data-t="${id}"]`)), ...meas.querySelectorAll(SHOWN)]) {
      if (!e) { if (!a.act) v.cur.style.display = a.end ? 'none' : ''; continue; }
      const q = e.getBoundingClientRect();
      r.x = Math.min(r.x, q.left - o.left); r.y = Math.min(r.y, q.top - o.top); r.r = Math.max(r.r, q.right - o.left); r.b = Math.max(r.b, q.bottom - o.top);
    }
  }
  return r;
}
const grow = (a, len, want, max) => { const n = Math.min(max, Math.max(len, want)); return [Math.max(0, Math.min(max - n, a - (n - len) / 2)), n]; };
// Tiles in a row share a width, and a height that fits every region in `fits`; each shows its region at the
// largest scale that fits, up to 1. A phone always shows its full width.
function crop(r, w) {
  const [cx, cw] = grow(r.x - PAD, r.r - r.x + 2 * PAD, AH > AW ? AW : MINW, AW), z = Math.min(1, w / cw);
  return { cx, cw, z, h: Math.min(AH, Math.max(MINH, r.b - r.y + 2 * PAD)) * z };
}
function frame(views, w, fits = views.map((v) => v.r)) {
  const H = Math.round(Math.max(...fits.map((r) => crop(r, w).h)));
  for (const v of views) {
    ({ cx: v.cx, cw: v.cw, z: v.z } = crop(v.r, w));
    [v.cx, v.cw] = grow(v.cx, v.cw, w / v.z, AW);
    [v.cy, v.ch] = grow(v.r.y - PAD, v.r.b - v.r.y + 2 * PAD, H / v.z, AH);
    v.fr.style.height = H + 2 + 'px';
    Object.assign(v.cam.style, { width: AW + 'px', height: AH + 'px', scale: v.z, translate: `${(w - v.cw * v.z) / 2 - v.cx * v.z}px ${-v.cy * v.z}px` });
    v.cam.style.setProperty('--k', Math.min(1 / v.z, 2.2));
    v.app.style.cssText = `width:${AW}px;height:${AH}px`;
  }
}
function mountView(t, label) {
  const root = node(`<div class="tile"><div class="th"><span class="id">${label}</span><span class="cap"></span></div><div class="fr"><div class="cam"><div class="app"></div>${CURSOR}</div></div></div>`);
  return { t, root, fr: root.querySelector('.fr'), cam: root.querySelector('.cam'), app: root.querySelector('.app'), cap: root.querySelector('.cap'), cur: root.querySelector('.cur') };
}
function paint(v, i, still) {
  const open = new Set([...v.app.querySelectorAll(SHOWN + ',.scrim')].map((e) => e.className));
  v.app.innerHTML = view(v.t.S[Math.min(i, v.t.S.length - 1)], v.t.has);
  for (const e of v.app.querySelectorAll(SHOWN + ',.scrim')) if (still || open.has(e.className)) e.dataset.still = '';
}
const secs = DECISIONS.map((d, di) => {
  const has = (parts) => Object.fromEntries(split(parts).map((p) => [p, true]));
  const today = { id: 'Today', ...trace(d.today, d.start, { today: true }) };
  const vars = Object.entries(d.variants).map(([id, v]) => ({ id, title: v.title, ...trace(v.path, d.start, has(v.parts)) }));
  const el = node(`<section><div class="hd"><span class="id">${di + FIRST}</span><span class="nm">${d.name}</span><span class="tk">${d.task}</span><button class="ph">Phone</button></div>
    <div class="ctl"><button class="pp">Play</button><span class="beats"></span></div><div class="grid"></div><div class="grid strip"></div></section>`);
  const sec = { el, today, vars, gen: 0, grid: el.querySelector('.grid'), strip: el.querySelector('.strip'), beats: el.querySelector('.beats'), pp: el.querySelector('.pp') };
  el.addEventListener('click', (e) => {
    const bi = e.target.closest('.beats i'), tile = e.target.closest('.tile');
    if (e.target.classList.contains('ph')) return togglePhone();
    if (e.target == sec.pp) return sec.playing ? stop(sec) : play(sec);
    if (bi) { stop(sec); sec.c = [...sec.beats.children].indexOf(bi); return show(sec, true); }
    if (tile?.closest('.strip') && !tile.classList.contains('today')) return open(sec, sec.stills.find((v) => v.root == tile).t);

  return sec;
});
// Each variant's pair with Today, framed so switching keeps Today's crop and the pair's height. And the stills,
// each at its marked tap, green on a variant.
function prepare(sec) {
  const span = (v, at) => region(v, at.map((x) => [x.i, [v.T[x.i]?.id].filter(Boolean)]));
  sec.pairs = new Map(sec.vars.map((t) => { const [a, b] = trim(sec.today, t), ats = pair(a, b); return [t, { a, b, ats, ra: span(a, ats[0]), rb: span(b, ats[1]) }]; }));
  const ps = [...sec.pairs.values()];
  sec.todayR = { x: Math.min(...ps.map((p) => p.ra.x)), y: Math.min(...ps.map((p) => p.ra.y)), r: Math.max(...ps.map((p) => p.ra.r)), b: Math.max(...ps.map((p) => p.ra.b)) };
  sec.fits = [sec.todayR, ...ps.map((p) => p.rb)];
  sec.stills = [sec.today, ...sec.vars].map((t, n) => ({ ...mountView(t, t.id), key: t.mark, add: n > 0, r: region(t, [[t.mark, [t.T[t.mark]?.id]]]) }));
  sec.stills[0].root.classList.add('today');
}
// The open variant beside Today, playing only the steps where they differ.
function open(sec, t) {
  const { a, b, ats, rb } = sec.pairs.get(t);
  sec.open = t;
  sec.views = [[a, sec.todayR], [b, rb]].map(([v, r], vi) => ({ ...mountView(v, vi ? t.id : 'Today'), at: ats[vi], r }));
  sec.beats.innerHTML = '<i><span></span></i>'.repeat(ats[0].length);
  sec.c = 0; stop(sec); layout(sec);
}
function layout(sec) {
  const W = sec.el.clientWidth, w = (n) => (W - 8 * (n - 1)) / n, n = sec.stills.length;
  sec.grid.replaceChildren(...sec.views.map((v) => v.root));
  frame(sec.views, w(2), sec.fits);
  show(sec, true);
  sec.strip.style.setProperty('--cols', n);
  sec.strip.replaceChildren(...sec.stills.map((v) => v.root));
  frame(sec.stills, w(n));
  for (const v of sec.stills) {
    v.root.classList.toggle('sel', v.t == sec.open);
    v.cap.className = 'cap m'; v.cap.textContent = v.t.title || '';
    paint(v, v.key, true);
    v.cur.style.display = 'none';
    v.app.querySelector(`[data-t="${v.t.T[v.key]?.id}"]`)?.classList.add('ring', ...(v.add ? ['add'] : []));
  }
}
function at(v, e) { let x = 0, y = 0; for (let n = e; n && n != v.app; n = n.offsetParent) { x += n.offsetLeft; y += n.offsetTop; } return `${x + Math.min(e.offsetWidth / 2, 60)}px ${y + e.offsetHeight * 0.6}px`; }
// Column c of the pair: a version that acts glides its cursor to the tap and presses it; one that waits dims.
function show(sec, instant) {
  const g = ++sec.gen, last = sec.views[0].at.length - 1;
  sec.el.classList.toggle('still', !!instant);
  for (const v of sec.views) {
    const a = v.at[Math.min(sec.c, last)], step = a.act ? v.t.T[a.i] : null, isNew = a.act && a.op == 'add';
    if (v.drawn !== a.i) { paint(v, a.i, v.drawn == null); v.drawn = a.i; }
    v.root.classList.toggle('hold', !a.act && !a.end);
    v.cap.className = 'cap' + (isNew ? ' add' : a.act ? '' : ' m');
    v.cap.textContent = a.act ? step.label : a.end ? 'Done' : 'waits';
    const e = step && v.app.querySelector(`[data-t="${step.id}"]`);
    if (!e) { if (!a.act) v.cur.style.display = a.end ? 'none' : ''; continue; }
