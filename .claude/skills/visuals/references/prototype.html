<!doctype html><html><head><meta charset="utf-8"><script>
/* PROTOTYPE. DECISIONS, numbered from FIRST, each {name, versions, view, formats, start, paths}:
   versions   {a, b, c: 'two or three words'}: three different approaches; Today is implied, shown only in the overview row.
   view(s,v,w) HTML of version v in state s at screen width w, with the app's real labels and data.
   formats    F's keys, the first shown first; default 'openR'.
   start      every version's first state; default {}.
   paths      {Today: 'id id', a: 'id'}, the taps in order: a journey that opens on its end. Without paths, live with Reset.
   Kit        k(id, patch, html, cls) a tap target merging patch into s · row(title, muted, end, cls, id, patch) · bar(html)
              classes: m muted · sp spacer · split panes · btn · ghost · cb box · on · pop menu · dot · chg what a version changes */
const FIRST = 1;
const DECISIONS = [{
  name: 'Restart a failing app', formats: 'openR folded', versions: { a: 'Restart on the row', b: 'Restart in the detail' },
  paths: { Today: 'row dots menu', a: 'inline', b: 'row restart' },
  view(s, v, w) {
    const stash = s.done ? row('stash', 'Running · just now', '', 'chg')
      : row('<span class=dot></span>stash', 'Restarted 3 times', v == 'a' ? k('inline', { done: 1 }, '↻ Restart', 'ghost') : '', '', 'row', { open: 1 });
    const list = bar('Apps') + stash + row('auth', ':5101') + row('scope', ':5106');
    const detail = bar(`stash<span class=sp></span>${v == 'b' ? k('restart', { done: 1 }, 'Restart', 'btn') : k('dots', { menu: 1 }, '⋯', 'ghost')}`)
      + (s.menu && !s.done ? `<div class=pop>${k('menu', { done: 1 }, 'Restart')}</div>` : '') + row('CPU', '', '7.2%');
    return w >= 640 ? `<div class=split><div>${list}</div><div>${s.open ? detail : ''}</div></div>` : s.open && !s.done ? detail : list;
  },
}];
</script>
<!-- ENGINE -->
<style>
:where(:root){color-scheme:dark;background:var(--background);--background:#0a0a0a;--foreground:#f5f5f5;--popover:#111;--primary:#346bf1;--primary-foreground:#fff;--muted-foreground:#818181;--destructive:#fb414a;--success:#10b981;--border:#191919;--input:#1e1e1e;--font-sans:system-ui,sans-serif;--font-mono:ui-monospace,monospace}
body{margin:0;font:13px/1.4 var(--font-sans);color:var(--foreground)}*{box-sizing:border-box}
.hd{display:flex;align-items:center;gap:8px;margin:0 44px 8px 0;white-space:nowrap}.hd~.hd{margin-right:0}
.no{font:500 13px var(--font-mono);color:var(--muted-foreground)}.nm{font-weight:600;overflow:hidden;text-overflow:ellipsis}
.seg{display:flex;border:1px solid var(--border);border-radius:6px;overflow:hidden}.seg span,.bt{padding:2px 8px;color:var(--muted-foreground);cursor:pointer;font-size:13px;display:flex;gap:5px;align-items:center}
.seg .on{color:var(--foreground);background:color-mix(in srgb,var(--foreground) 10%,transparent)}.bt{border:1px solid var(--border);border-radius:6px;margin-left:auto}
.dev{border:1px solid currentColor;border-radius:2px}.beats{display:flex;flex:1;gap:3px}.beats i{flex:1;height:20px;display:grid;align-items:center;cursor:pointer}
.beats i:after{content:'';height:4px;border-radius:2px;background:color-mix(in srgb,var(--foreground) 18%,transparent)}.beats .past:after{background:color-mix(in srgb,var(--foreground) 55%,transparent)}.beats .now:after{background:var(--primary)}
.row{display:grid;gap:8px;justify-content:center;margin-bottom:12px}.v{display:grid;gap:4px;align-content:start}.vh{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.vh b{font:500 13px var(--font-mono);padding:0 4px;border:1px solid var(--input);border-radius:4px;margin-right:5px}
.pv{cursor:pointer}.pv .vh{font-weight:500}.pv.on .fr{border-color:var(--primary);box-shadow:0 0 0 1px var(--primary)}
.dec{padding:22px 0 6px}.dec+.dec{border-top:2px solid color-mix(in srgb,var(--foreground) 25%,transparent);margin-top:18px}
.dec>.hd .no{font:600 15px var(--font-mono);color:var(--background);background:var(--foreground);padding:1px 8px;border-radius:6px}.dec>.hd .nm{font-size:16px}
.fr{position:relative;overflow:hidden;border:1px solid var(--border);border-radius:8px}.sc{position:absolute;transform-origin:0 0;transition:transform .5s cubic-bezier(.4,0,.2,1)}
.cur{position:absolute;width:15px;z-index:9;pointer-events:none;transition:translate .55s cubic-bezier(.4,0,.2,1);display:none}
.app{background:var(--background);color:var(--foreground);font-size:13px;line-height:1.45;height:100%}
.app .r{display:flex;gap:10px;align-items:center;padding:6px 12px;border-bottom:1px solid var(--border);min-height:46px;white-space:nowrap}.app .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.app .m{color:var(--muted-foreground)}.app .n{color:var(--muted-foreground);text-align:right}.app .tb{display:flex;align-items:center;gap:6px;padding:0 12px;height:38px;border-bottom:1px solid var(--border);font-weight:600}.app .sp{flex:1}
.app .split{display:flex;height:100%}.app .split>div{flex:1;min-width:0;position:relative}.app .split>div+div{border-left:1px solid var(--border)}
.app .btn{padding:1px 9px;border-radius:6px;background:var(--primary);color:var(--primary-foreground)}.app .ghost{padding:1px 7px;border:1px solid var(--input);border-radius:6px;color:var(--muted-foreground)}
.app .cb{width:16px;height:16px;border:1px solid var(--input);border-radius:4px;display:grid;place-items:center;font-size:11px}.app .cb.on{background:var(--primary);color:var(--primary-foreground)}
.app .pop{position:absolute;right:10px;top:34px;width:120px;padding:4px 8px;border:1px solid var(--input);border-radius:6px;background:var(--popover);z-index:2}
.app .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--destructive);margin-right:6px}.app .chg{background:color-mix(in srgb,var(--success) 12%,transparent)}
.app [data-t]{cursor:pointer}.app .ring{outline:2px solid var(--primary);outline-offset:-2px;border-radius:5px}
::view-transition-group(*){animation-duration:.35s}
</style></head><body><div id="out"></div><script>
// Formats: label, width, height, two halves.
const F={folded:['Folded',466,678],foldedR:['Folded ⟳',678,466],open:['Open',669,951,1],openR:['Open ⟳',951,669,1],d1512:['1512',1512,982],d1920:['1920',1920,1080],d3440:['3440',3440,1440]};
const CUR='<svg class=cur viewBox="0 0 13 19"><path d="M1 1v14.2l3.7-3.5 2.5 5.9 2.3-1-2.5-5.8H12z" fill="#fff" stroke="#000"/></svg>';
const k=(id,patch,html='',cls='')=>`<span class="${cls}" data-t="${id}" data-p='${JSON.stringify(patch)}'>${html}</span>`;
const row=(t,m='',n='',cls='',id,patch)=>{const h=`<div class=t>${t}${m&&`<div class=m>${m}</div>`}</div>${n&&`<div class=n>${n}</div>`}`;return id?k(id,patch,h,`r ${cls}`):`<div class="r ${cls}">${h}</div>`},bar=html=>`<div class=tb>${html}</div>`;
const $=(q,r=document)=>r.querySelector(q),$$=(q,r=document)=>[...r.querySelectorAll(q)],wait=ms=>new Promise(r=>setTimeout(r,ms));
// ?v=12b,13a keeps only those versions beside Today, and only their decisions.
const PICK=new URLSearchParams(location.search).get('v')?.split(',');
const D=DECISIONS.map(({formats='openR',start={},...d},i)=>({...d,formats,start,no:FIRST+i,V:['Today',...Object.keys(d.versions).filter(v=>!PICK||PICK.includes(FIRST+i+v))],fm:formats.split(' ')[0]})).filter(d=>d.V.length>1);
// A journey's states: each tap merges its target's patch into the state before it.
function trace(d,v){const S=[d.start],w=F[d.fm][1],box=document.createElement('div');
  for(const id of (d.paths?.[v]||'').split(' ').filter(Boolean)){box.innerHTML=d.view(S.at(-1),v,w);const t=$(`[data-t="${id}"]`,box);if(!t){console.error(`${d.no} ${v}: no "${id}"`);break}S.push({...S.at(-1),...JSON.parse(t.dataset.p)})}
  return S}
function reset(d){d.S=Object.fromEntries(d.V.map(v=>[v,trace(d,v)]));d.beats=Math.max(...d.V.map(v=>d.S[v].length));const B=new URLSearchParams(location.search).get('beat');d.c=B==null?d.beats-1:Math.min(+B,d.beats-1);d.L=Object.fromEntries(d.V.map(v=>[v,d.S[v][Math.min(d.c,d.S[v].length-1)]]));d.sel??=d.V.filter(v=>v!='Today')}
const next=(d,v)=>(d.paths?.[v]||'').split(' ')[d.c];
function draw(){const W=$('#out').clientWidth;
  $('#out').innerHTML=D.map(d=>{const [,w,h]=F[d.fm],n=d.sel.length,lab=v=>`${v=='Today'?'':`<b>${v}</b>`}${v=='Today'?'Today':d.versions[v]}`;
    // One height for every format and choice, so nothing below moves.
    const H=Math.min(...d.formats.split(' ').map(f=>F[f][2]*(W-8)/2/F[f][1])),s=Math.min((W-8*(n-1))/n/w,H/h),pw=(W-8*(d.V.length-1))/d.V.length;
    const fm=d.formats.includes(' ')?`<span class=seg>${d.formats.split(' ').map(f=>{const [l,fw,fh,two]=F[f];return `<span class="${f==d.fm?'on':''}" data-f="${d.no} ${f}"><span class=dev style="width:${fw>fh?18:12}px;height:${fw>fh?13:17}px;${two?(fw>fh?'background:linear-gradient(90deg,#0000 47%,currentColor 0 53%,#0000 0)':'background:linear-gradient(#0000 47%,currentColor 0 53%,#0000 0)'):''}"></span>${l}</span>`}).join('')}</span>`:'';
    const tl=d.paths?`<span class=beats>${Array.from({length:d.beats},(_,i)=>`<i data-c="${d.no} ${i}" class="${i<d.c?'past':i==d.c?'now':''}"></i>`).join('')}</span><span class=bt data-r="${d.no}">Replay</span>`:`<span class=bt data-x="${d.no}">Reset</span>`;
    const fr=(v,cls,fw,fh,sc)=>`<div class="fr app" data-v="${d.no} ${v} ${cls}"${cls=='small'?' inert':''} style="width:${fw}px;height:${fh}px"><div class=sc style="width:${w}px;height:${h}px;transform:scale(${sc})"></div>${cls=='big'?CUR:''}</div>`;
    return `<section class=dec><div class=hd><span class=no>${d.no}</span><span class=nm>${d.name}</span>${fm}${tl}</div>
      <div class=row style="height:${H+28}px;grid-template-columns:repeat(${n},${w*s}px)">${d.sel.map(v=>`<div class=v><div class=vh>${lab(v)}</div>${fr(v,'big',w*s,h*s,s)}</div>`).join('')}</div>
      <div class=row style="grid-template-columns:repeat(${d.V.length},${pw}px)">${d.V.map(v=>`<div class="v pv${d.sel.includes(v)?' on':''}" data-s="${d.no} ${v}"><div class=vh>${lab(v)}</div>${fr(v,'small',pw,120,1)}</div>`).join('')}</div></section>`}).join('');
  D.forEach(d=>fill(d,0))}
// Frames get their version's state; morphing parts keep their names; small frames cut to the rows that matter.
function fill(d,anim){const w=F[d.fm][1];
  for(const f of $$(`[data-v^="${d.no} "]`)){const [,v,cls]=f.dataset.v.split(' ');$('.sc',f).innerHTML=d.view(d.L[v],v,w);$$('[data-t],.pop,.chg',f).forEach((e,i)=>e.style.viewTransitionName=`${cls}${d.no}${v}${e.dataset.t||i}`)}
  let R=null;const add=e=>{e=e.closest('.pop,.r,.tb')||e;let x=0,y=0;for(let n=e;n&&!n.classList.contains('sc');n=n.offsetParent){x+=n.offsetLeft;y+=n.offsetTop}
    R=R?[Math.min(R[0],x),Math.min(R[1],y),Math.max(R[2],x+e.offsetWidth),Math.max(R[3],y+e.offsetHeight)]:[x,y,x+e.offsetWidth,y+e.offsetHeight]};
  for(const f of $$(`[data-v$=" small"][data-v^="${d.no} "]`)){const v=f.dataset.v.split(' ')[1];$$('.chg,.pop',f).forEach(add);const t=next(d,v);t&&$$(`[data-t="${t}"]`,f).forEach(add)}
  if(!R)$$(`[data-v$=" small"][data-v^="${d.no} "] .tb`).forEach(add);
  for(const f of $$(`[data-v$=" small"][data-v^="${d.no} "]`)){const sc=$('.sc',f),[bw,bh,h]=[f.clientWidth,f.clientHeight,F[d.fm][2]];let s=Math.min(bw/w,bh/h),x=0,y=0;
    if(R){s=Math.min(1,bw/(R[2]-R[0]+20),bh/(R[3]-R[1]+20));x=Math.min(0,Math.max(bw-w*s,bw/2-(R[0]+R[2])/2*s));y=Math.min(0,Math.max(bh-h*s,bh/2-(R[1]+R[3])/2*s))}
    sc.style.transition=anim?'':'none';sc.style.transform=`translate(${x}px,${y}px) scale(${s})`}
  $$(`[data-c^="${d.no} "]`).forEach((e,i)=>e.className=i<d.c?'past':i==d.c?'now':'')}
// The cursor glides to a big frame's next tap.
function aim(d,v,still){const f=$(`[data-v="${d.no} ${v} big"]`);if(!f)return;const c=$('.cur',f),t=next(d,v)&&$(`[data-t="${next(d,v)}"]`,f);if(!t){c.style.display='none';return}
  const r=t.getBoundingClientRect(),q=f.getBoundingClientRect();if(c.style.display!='block'){c.style.transition='none';c.style.translate=`${q.width/2}px ${q.height}px`;c.style.display='block';c.offsetWidth}
  c.style.transition=still?'none':'';c.style.translate=`${r.left-q.left+Math.min(r.width/2,40)}px ${r.top-q.top+r.height*.6}px`;return [c,t]}
let RUN=0;
async function replay(d){const run=++RUN;d.c=0;d.V.forEach(v=>d.L[v]=d.S[v][0]);fill(d,1);await wait(300);
  for(;d.c<d.beats-1;){const hit=d.sel.map(v=>aim(d,v)).filter(Boolean);await wait(650);if(run!=RUN)return;
    hit.forEach(([c,t])=>{c.animate([{scale:.8},{scale:1}],220);t.classList.add('ring')});await wait(250);
    d.c++;d.V.forEach(v=>d.L[v]=d.S[v][Math.min(d.c,d.S[v].length-1)]);await (document.startViewTransition?document.startViewTransition(()=>fill(d,1)).finished:fill(d,1));if(run!=RUN)return;await wait(400)}
  d.sel.forEach(v=>aim(d,v))}
document.body.onclick=e=>{const t=e.target.closest('[data-t],[data-f],[data-c],[data-r],[data-x],[data-s]');if(!t)return;const a=(t.dataset.f||t.dataset.c||t.dataset.r||t.dataset.x||t.dataset.s||'').split(' '),d=D.find(d=>d.no==+a[0]);
  if(t.dataset.t){const [no,v]=t.closest('[data-v]').dataset.v.split(' '),dd=D.find(d=>d.no==+no);dd.L[v]={...dd.L[v],...JSON.parse(t.dataset.p)};return fill(dd,1)}
  RUN++;if(t.dataset.f){d.fm=a[1];reset(d)}else if(t.dataset.x)reset(d);else if(t.dataset.r)return replay(d);
  else if(t.dataset.s){const on=d.sel.includes(a[1]);if(on&&d.sel.length==1)return;d.sel=d.V.filter(v=>v==a[1]?!on:d.sel.includes(v))}
  else if(t.dataset.c){d.c=+a[1];d.V.forEach(v=>d.L[v]=d.S[v][Math.min(d.c,d.S[v].length-1)]);fill(d,1);return d.sel.forEach(v=>aim(d,v,1))}
  draw()};
D.forEach(reset);draw();addEventListener('resize',draw);
</script></body></html>
