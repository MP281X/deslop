packages:
  - apps/*
  - packages/*
  - tools/*

allowBuilds:
  onnxruntime-node: false
  protobufjs: false

catalog:
  vite-plus: 1.4.0
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0

overrides:
  vite: 'catalog:'
  # apple-targets 5.0.0 pins the SDK 55 config loader, which needs TypeScript 5; SDK 58's loader works the same.
  '@bacons/apple-targets>@expo/prebuild-config': ^58.0

# Vite+ exposes Vite 8 under its own package version; accept it only for these inspected Vite 8 consumers.
peerDependencyRules:
  allowedVersions:
    '@tailwindcss/vite@4.3.3>vite': 1.4.0
    '@tanstack/router-plugin@1.168.48>vite': 1.4.0
    '@vitejs/plugin-react@6.1.2>vite': 1.4.0
    '@vitest/mocker@5.0.5>vite': 1.4.0
    'vitest@5.0.5>vite': 1.4.0

# apple-targets 5.0.0 loads these without declaring them.
packageExtensions:
  '@bacons/apple-targets':
    dependencies:
      '@expo/image-utils': ^0.12
      '@expo/plist': ^0.10
      chalk: ^4.1
strictPeerDependencies: true
minimumReleaseAge: 0
