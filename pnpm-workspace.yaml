packages:
  - apps/*
  - packages/*
  - tools/*

allowBuilds:
  '@google/genai': false
  esbuild: false
  protobufjs: false

catalogMode: prefer

catalog:
  vite-plus: 1.0.0
  vite: npm:@voidzero-dev/vite-plus-core@1.0.0
overrides:
  vite: 'catalog:'
peerDependencyRules:
  allowAny: [vite, typescript]
minimumReleaseAgeExclude:
  - '@effect/tsgo@0.47.0'
  - '@effect/tsgo-darwin-arm64@0.47.0'
  - '@effect/tsgo-darwin-x64@0.47.0'
  - '@effect/tsgo-linux-arm64@0.47.0'
  - '@effect/tsgo-linux-arm@0.47.0'
  - '@effect/tsgo-linux-x64@0.47.0'
  - '@effect/tsgo-win32-arm64@0.47.0'
  - '@effect/tsgo-win32-x64@0.47.0'
