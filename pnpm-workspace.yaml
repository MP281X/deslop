packages:
  - apps/*
  - packages/*
  - tools/coding-standards
  - tools/create-*

allowBuilds:
  '@google/genai': false
  esbuild: false
  protobufjs: false

catalogMode: prefer

catalog:
  vite-plus: 1.0.0
  vite: npm:@voidzero-dev/vite-plus-core@1.0.0
overrides:
  vite: 'catalog:'
peerDependencyRules:
  allowAny: [vite, typescript]
minimumReleaseAge: 0
