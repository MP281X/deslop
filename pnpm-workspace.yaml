packages:
  - apps/*
  - packages/*
  - tools/coding-standards
  - tools/media
  - tools/create-*

allowBuilds:
  '@google/genai': false
  esbuild: false
  onnxruntime-node: false
  protobufjs: false

catalogMode: prefer

catalog:
  vite-plus: 1.0.0
  vite: npm:@voidzero-dev/vite-plus-core@1.0.0
overrides:
  vite: 'catalog:'
# Vite+ 1.0.0 exposes Vite 8 under its own 1.0.0 package version.
# Accept that alias only for these inspected Vite-8-compatible consumers.
peerDependencyRules:
  allowedVersions:
    '@tailwindcss/vite@4.3.3>vite': 1.0.0
    '@tanstack/router-plugin@1.168.42>vite': 1.0.0
    '@vitejs/plugin-react@6.1.1>vite': 1.0.0
    '@vitest/mocker@5.0.1>vite': 1.0.0
    'vitest@5.0.1>vite': 1.0.0
strictPeerDependencies: true
minimumReleaseAge: 0
