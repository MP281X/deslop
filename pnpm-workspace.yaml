packages:
  - apps/*
  - packages/*
  - tools/*

catalog:
  vite-plus: 1.8.0
  # @effect/tsgo 0.73.4 patches tsrs2 and tsrs4 only, and Vite+ 1.8 needs tsrs4; back to latest once it patches tsrs5.
  tsrs: 7.1.0-beta.tsrs4
  vite: npm:@voidzero-dev/vite-plus-core@8.3.8001

overrides:
  vite: 'catalog:'
  # apple-targets 5.0.0 pins the SDK 55 config loader, which needs TypeScript 5; SDK 58's loader works the same.
  '@bacons/apple-targets>@expo/prebuild-config': ^58.0

packageExtensions:
  # apple-targets 5.0.0 loads these without declaring them.
  '@bacons/apple-targets':
    dependencies:
      '@expo/image-utils': ^0.12
      '@expo/plist': ^0.10
      chalk: ^4.1
strictPeerDependencies: true
minimumReleaseAge: 0
